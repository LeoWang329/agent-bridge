  }
  else {
    o.push(box('quiet', ICO.info, '还没有交付结论',
      '<p style="margin:0">'+(n.status==='rejected'
        ? '这个环节还没开跑就被本地挡下了，不存在交付结论。'
        : '这个环节还没跑到收尾那一步。')+'</p>'));
  }

  const ws = (w.worktree && WT[w.worktree.state]) || WT.unlogged;
  o.push('<div style="margin-top:11px;border-top:1px dashed var(--line);padding-top:9px">'+
    '<div class="kv"><span class="k">工作副本</span><span class="v"><b>'+esc(ws[0])+'</b>'+
      '<div style="color:var(--faint);font-size:11.5px;line-height:1.55;margin-top:3px">'+esc(ws[1])+'</div>'+
      (w.worktree && w.worktree.why ? '<div style="color:var(--faint);font-size:11.5px;line-height:1.55;margin-top:3px">'+esc(w.worktree.why)+'</div>' : '')+
      (w.worktree && w.worktree.path && w.worktree.state!=='kept'
        ? '<div style="margin-top:6px"><code class="path">'+esc(w.worktree.path)+'</code>'+copyBtn('复制路径', w.worktree.path)+'</div>' : '')+
    '</span></div></div>');
  return '<div class="sec">'+o.join('')+'</div>';
}

function attemptBody(n, a){
  const o = [];
  const inTxt = a.input && a.input.s==='have' ? a.input.text : null;
  o.push('<details class="fold"><summary>'+ICO.caret+'输入原文'+
    '<span class="sm">'+(inTxt ? fmtN(inTxt.length)+' 字' : '不可读')+'</span></summary>'+
    '<div class="fold-body">'+
      (inTxt ? '<pre class="raw scroll">'+esc(inTxt)+'</pre><div style="margin-top:7px">'+copyBtn('复制输入原文', inTxt)+'</div>'
             : assetRow('输入原文', a.input))+
      (a.input && a.input.s==='unavailable' && a.input.code==='SOURCE_RUN_NOT_ARCHIVED'
        ? '<div style="margin-top:6px;font-size:12.5px;color:var(--faint);line-height:1.6">'+
          '原运行未归档输入原文，仅保留指纹。<b>这里不会"还原"一份看起来对的输入</b> —— 没有逐字节验证过的还原就是伪造历史。</div>' : '')+
    '</div></details>');

  const outTxt = a.output && a.output.s==='have' ? a.output.text : null;
  if (outTxt){
    const raw = ATT.raw;
    o.push('<div class="fold" style="background:var(--surface)"><div style="padding:9px 11px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650">产出'+
      '<span class="sm" style="font:10.5px/1 var(--mono);color:var(--faint);font-weight:400">'+fmtN(outTxt.length)+' 字</span>'+
      '<span class="viewswitch"><button type="button" data-raw="0" aria-pressed="'+(!raw)+'">渲染</button>'+
      '<button type="button" data-raw="1" aria-pressed="'+raw+'">看原文</button></span></div>'+
      '<div class="fold-body" id="outBody">'+ (raw ? '<pre class="raw scroll">'+esc(outTxt)+'</pre>' : '<div class="md">'+md(outTxt)+'</div>')+
      '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'+copyBtn('复制产出原文', outTxt)+
      '<button type="button" class="totop" id="toTop">回到顶部</button></div>'+
      '<div style="clear:both"></div></div></div>');
  } else {
    o.push('<div class="fold" style="background:var(--surface)"><div class="fold-body" style="border-top:0;padding-top:11px">'+assetRow('产出', a.output)+'</div></div>');
  }

  if (a.reject) o.push('<div style="margin-top:2px">'+bounded(a.reject, '被打回的原因（有界摘要）')+'</div>');
  else if (a.rejectAsset) o.push('<div style="margin-top:2px">'+assetRow('打回原因', a.rejectAsset)+'</div>');
  return o.join('');
}

function attemptsBlock(n){
  const as = n.attempts || [];
  if (!as.length) return '';
  if (ATT.seq !== n.seq){ ATT = {seq:n.seq, idx:as.length-1, raw:false}; }
  const idx = Math.min(ATT.idx, as.length-1);
  const V = {accepted:'通过', rejected:'被打回', running:'进行中', queued:'排队中', discovered:'准备中',
             failed:'引擎报错', timeout:'超时', unknown:'说不清', abandoned:'未见结局',
             rejected_local:'本地挡下', unlogged:'状态未记录'};
  /* 只有 1 次尝试时不显示任何分段控件。分段由数组生成，段数没有上限——
     将来在「环节 → 轮 → 尝试」里，轮这一层用同一个规则再套一层即可。 */
  const bar = as.length > 1
    ? '<div class="segbar">'+as.map((a,i)=>'<button type="button" class="seg" data-att="'+i+'" data-r="'+
        (a.verdict==='rejected'?'rejected':a.verdict==='accepted'?'accepted':'')+'" aria-pressed="'+(i===idx)+'">'+
        '<span class="sdot"></span>第 '+a.n+' 次 · '+(V[a.verdict]||a.verdict)+'</button>').join('')+
      '<span style="font:10.5px/1.5 var(--mono);color:var(--faint);flex:1 1 100%">两次的输入是不同的：第 2 次由「上次被打回的原因 + 纠正要求 + 原任务原文」拼出。</span></div>'
    : '';
  return '<div class="sec"><h3 class="sec-h">输入与产出'+
    (as.length>1 ? '<span class="hint">'+as.length+' 次尝试</span>' : '<span class="hint">单次尝试</span>')+'</h3>'+
    bar + attemptBody(n, as[idx]) + '</div>';
}

function sceneBlock(n){
  const s = n.scene || {};
  const none = n.sceneNone;
  return '<div class="sec"><h3 class="sec-h">现场文件<span class="hint">目录，三样各自独立</span></h3>'+
    (none ? box('lost', ICO.cut, '本次未捕获现场',
      '<p style="margin:0">系统只有在<b>有序收场</b>时才会把会话日志等现场文件抢救出来；这次没有机会跑那一步，所以<b>一样都没留下</b>。'+
      '这里不给一个点了 404 的入口。</p>') : '')+
    assetRow('会话日志', s.session, '打开会话日志')+
    assetRow('回答原文', s.answer, '打开回答原文')+
    assetRow('状态快照', s.snapshot, '打开状态快照')+
  '</div>';
}

function renderDetail(sc, sel){
  const el = $('#detail'), ws = $('#workspace');
  const n = sc.nodes.find(x => x.seq === sel);
  if (!n){ el.hidden = true; ws.setAttribute('data-detail','closed'); return; }
  el.hidden = false; ws.setAttribute('data-detail','open');
  COPYBUF.length = 0;
  const st = STATUS[n.status] || {};
  el.innerHTML =
    '<div class="d-head"><div class="d-title">'+engBadge(n.engine,false)+
      '<h2 class="d-id" title="'+esc(n.id)+'">'+esc(n.id)+'</h2>'+
      '<span class="nb-seq">#'+n.seq+'</span>'+
      '<button type="button" class="d-close" id="dClose" title="关闭详情" aria-label="关闭详情面板"><span aria-hidden="true">✕</span></button></div>'+
      '<div class="d-sub">'+statusChip(n)+
        (n.reused ? '<span class="chip reuse">↺ 复用 · 没真跑，直接用了上次的结果</span>' : '')+
        '<span class="chip">'+esc(st.long||'')+'</span>'+
      '</div>'+
      (n.note ? '<div style="margin-top:7px;font:11px/1.6 var(--mono);color:var(--faint)">'+esc(n.note)+'</div>' : '')+
    '</div>'+
    '<div class="d-scroll scroll" id="dScroll">'+
      factsHTML(n)+
      (n.reused ? '<div class="sec">'+box('quiet', ICO.info, '这是一次复用，不是一次验证',
        '<p style="margin:0">这个环节<b>没真跑</b>，直接用了 <code>'+esc(n.reuseFrom)+'</code> 的结果。'+
        '上面的「原执行耗时」是<b>当初那次</b>跑出来的；这次只做了一次 '+fmtDur(n.t.r[1]-n.t.r[0])+' 的复用校验。</p>')+'</div>' : '')+
      statusBlock(n)+
      writeBlock(n)+
      attemptsBlock(n)+
      sceneBlock(n)+
    '</div>';
}

/* ============================================================
   8. 状态与装配
   ============================================================ */
(function(){ const s = SCENES.find(x=>x.key==='offline'); s.run.replayIncomplete = true; s.run.replayFrom = 1907; })();

let SC = SCENES[0], SEL = SC.select, VIEW = 'graph', ZOOM = 1;

function hasDeps(sc){ return sc.edges && sc.edges.length > 0; }

function renderLegend(sc){
  if (VIEW !== 'graph' || !sc.nodes.length){ $('#legend').innerHTML = ''; return; }
  if (!hasDeps(sc)){ $('#legend').innerHTML = '<span style="color:var(--faint)">没有任何依赖信息</span>'; return; }
  const inf = sc.edges.some(e => e.kind==='inferred');
  $('#legend').innerHTML =
    '<i title="用户自己写的一句声明"><span class="lg-line"></span>声明（未经验证）</i>'+
    (inf ? '<i title="系统从输入原文里猜出来的"><span class="lg-dash"></span>推断（可点开看依据）</i>' : '')+
    '<span style="color:var(--faint)">纯时间先后不画箭头</span>';
}

function applyZoom(){
  const cv = $('#gcanvas'), wrap = $('#gwrap');
  let sp = document.getElementById('gspacer');
  if (!SC.nodes.length){
    cv.style.cssText = 'padding:22px'; if (sp) sp.remove();
    $('#zoomBox').style.visibility = 'hidden'; return;
  }
  $('#zoomBox').style.visibility = VIEW==='graph' ? 'visible' : 'hidden';
  /* 缩放条是两个视图共用的,切回图视图要把时间轴那边设的禁用/命名还原 */
  $('#zoomIn').disabled = false; $('#zoomOut').disabled = false;
  $('#zoomIn').setAttribute('aria-label','放大图视图');
  $('#zoomOut').setAttribute('aria-label','缩小图视图');
  $('#zoomFit').setAttribute('aria-label','缩放至适应画布');
  const GW = parseFloat(cv.style.width) || 400, GH = parseFloat(cv.style.height) || 300;
  cv.style.transformOrigin = '0 0';
  cv.style.transform = 'scale('+ZOOM+')';
  cv.style.position = 'absolute'; cv.style.top = '0'; cv.style.left = '0'; cv.style.padding = '0';
  if (!sp){ sp = document.createElement('div'); sp.id = 'gspacer';
    sp.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none'; wrap.appendChild(sp); }
  sp.style.width = (GW*ZOOM)+'px'; sp.style.height = (GH*ZOOM)+'px';
  wrap.setAttribute('data-scrollx', (GW*ZOOM > wrap.clientWidth + 2) ? '1' : '0');
  $('#zoomVal').textContent = Math.round(ZOOM*100)+'%';
}
function fitZoom(){
  const cv = $('#gcanvas'), wrap = $('#gwrap');
  const GW = parseFloat(cv.style.width) || 1, GH = parseFloat(cv.style.height) || 1;
  const z = Math.min(1, (wrap.clientWidth - 26)/GW, (wrap.clientHeight - 26)/GH);
  ZOOM = Math.max(.3, Math.round(z*20)/20); applyZoom();
}

function render(){
  if (!hasDeps(SC) && SC.nodes.length) VIEW = 'timeline';
  $('#tabGraph').setAttribute('aria-pressed', VIEW==='graph');
  $('#tabTimeline').setAttribute('aria-pressed', VIEW==='timeline');
  $('#tabGraph').disabled = (!hasDeps(SC) && SC.nodes.length > 0);
  $('#tabGraph').title = $('#tabGraph').disabled ? '这次运行没有任何依赖信息，图视图会退化成一堆孤立方块' : '';
  $('#gwrap').hidden = VIEW !== 'graph';
  $('#tlwrap').hidden = VIEW !== 'timeline';

  renderTop(SC); renderBanners(SC); renderLegend(SC);
  if (VIEW === 'graph'){ renderGraph(SC, SEL); applyZoom(); $('#tlKey').hidden = true; }
  else { renderTimeline(SC, SEL); applyTlZoom(); }
  renderDetail(SC, SEL);
}

function setScene(key){
  const sc = SCENES.find(s => s.key === key); if (!sc) return;
  SC = sc; SEL = sc.select; VIEW = 'graph'; ZOOM = 1; TLZ = sc.tlz || 1; QOPEN = false;
  ATT = {seq:null, idx:0, raw:false};
  const pop = document.getElementById('edgePop'); if (pop) pop.remove();
  document.querySelectorAll('.scene-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.scene===key));
  $('#conn').setAttribute('data-s', sc.conn.s); $('#connText').textContent = sc.conn.text;
  render();
  if (sc.key === 'scale') requestAnimationFrame(fitZoom);
}

$('#scenes').innerHTML = SCENES.map(s =>
  '<button type="button" class="scene-btn" data-scene="'+s.key+'" aria-pressed="'+(s.key===SC.key)+'">'+esc(s.label)+'</button>').join('');

/* ---- 主题 ---- */
function setTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  try { t ? localStorage.setItem('gvz-theme', t) : localStorage.removeItem('gvz-theme'); } catch(e){}
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeLabel').textContent = dark ? '浅色' : '深色';
}
try { const saved = localStorage.getItem('gvz-theme'); if (saved) setTheme(saved); else setTheme(null); } catch(e){ setTheme(null); }

/* ---- 边解释气泡 ---- */
function showEdgePop(i, ev){
  const e = ($('#gcanvas')._edges || [])[i]; if (!e) return;
  const wrap = $('#gwrap'), r = wrap.getBoundingClientRect();
  let pop = document.getElementById('edgePop');
  if (!pop){ pop = document.createElement('div'); pop.id = 'edgePop'; pop.className = 'edgepop'; wrap.appendChild(pop); }
  const body = e.kind === 'inferred'
    ? '<b>推断的依赖 · 可能猜错，也可能漏掉</b>'+e.why+'<div style="margin-top:6px;color:var(--faint)">系统发现后一个环节的输入里提到了前一个环节的产出文件，据此猜了一条边。</div>'
    : '<b>显式声明（未经验证）</b>用户自己写了这条依赖。<div style="margin-top:6px;color:var(--faint)"><b>仅展示，不影响执行顺序</b> —— 系统既不校验也不据此调度。</div>';
  const warn = e.warn ? '<div style="margin-top:8px;padding:7px 9px;border-radius:6px;background:color-mix(in oklab,var(--c-timeout) 13%,var(--surface));border:1px solid color-mix(in oklab,var(--c-timeout) 42%,var(--line));color:var(--ink)"><b>一致性提示</b> · '+e.warn+'</div>' : '';
  pop.innerHTML = '<button type="button" class="x" id="popX" aria-label="关闭说明"><span aria-hidden="true">✕</span></button>'+body+warn;
  const x = Math.min(Math.max(8, ev.clientX - r.left + wrap.scrollLeft + 12), wrap.scrollLeft + wrap.clientWidth - 320);
  const y = Math.max(8, ev.clientY - r.top + wrap.scrollTop + 10);
  pop.style.left = x+'px'; pop.style.top = y+'px';
}

/* ---- 拖拽平移:鼠标用户没有触控板的双指手势,给一个抓手。
       阈值 5px —— 小于它仍然算一次点击,不会把「选中环节」这件事弄丢。 ---- */
let SUPPRESS_CLICK = false;
function enablePan(el){
  let sx = 0, sy = 0, sl = 0, st = 0, down = false, panned = false;
  const move = e => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!panned && Math.abs(dx) + Math.abs(dy) < 5) return;
    panned = true; el.classList.add('panning');
    el.scrollLeft = sl - dx; el.scrollTop = st - dy;
  };
  const up = () => {
    if (!down) return;
    down = false; el.classList.remove('panning');
    if (panned) SUPPRESS_CLICK = true;
    panned = false;
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
  };
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    SUPPRESS_CLICK = false;
    down = true; panned = false;
    sx = e.clientX; sy = e.clientY; sl = el.scrollLeft; st = el.scrollTop;
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  });
  el.addEventListener('wheel', e => {
    if (e.shiftKey && e.deltaY && !e.deltaX){ el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive:false});
}
enablePan($('#gwrap')); enablePan($('#tlwrap'));

/* ---- 事件(全部委托,只读:不改变任何运行状态) ---- */
document.addEventListener('click', ev => {
  if (SUPPRESS_CLICK){ SUPPRESS_CLICK = false; return; }   /* 刚拖过,这一下不是点击 */
  const t = ev.target;
  const hit = s => t.closest ? t.closest(s) : null;

  const sb = hit('.scene-btn'); if (sb){ setScene(sb.dataset.scene); return; }
  if (hit('#themeBtn')){
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark'); return;
  }
  if (hit('#tabGraph') && !$('#tabGraph').disabled){ VIEW='graph'; render(); return; }
  if (hit('#tabTimeline')){ VIEW='timeline'; render(); return; }
  const tlStep = d => { const s = TLZ < 2 ? .5 : 1; TLZ = Math.min(8, Math.max(1, +(TLZ + d*s).toFixed(1)));
                        renderTimeline(SC, SEL); applyTlZoom(); };
  if (hit('#zoomIn')){ if (VIEW === 'graph'){ ZOOM = Math.min(1.8, ZOOM+.1); applyZoom(); } else tlStep(+1); return; }
  if (hit('#zoomOut')){ if (VIEW === 'graph'){ ZOOM = Math.max(.3, ZOOM-.1); applyZoom(); } else tlStep(-1); return; }
  if (hit('#zoomFit')){ if (VIEW === 'graph') fitZoom(); else { TLZ = 1; renderTimeline(SC, SEL); applyTlZoom(); } return; }
  if (hit('#qtoggle')){ QOPEN = !QOPEN; renderGraph(SC, SEL); applyZoom(); return; }
  if (hit('#popX')){ const p = document.getElementById('edgePop'); if (p) p.remove(); return; }

  const edge = t.getAttribute && t.getAttribute('data-edge');
  if (edge != null){ showEdgePop(+edge, ev); return; }

  const cp = hit('.copy'); if (cp){ copyText(COPYBUF[+cp.dataset.copy] || '', cp); return; }
  if (hit('#dClose')){ SEL = null; render(); return; }

  const seg = hit('.seg'); if (seg){ ATT.idx = +seg.dataset.att; ATT.raw = false; renderDetail(SC, SEL); return; }
  const rw = t.closest && t.closest('[data-raw]');
  if (rw){ ATT.raw = rw.dataset.raw === '1'; renderDetail(SC, SEL); return; }
  if (hit('#toTop')){ const s = $('#dScroll'); if (s) s.scrollTo({top:0, behavior:'smooth'}); return; }

  const nb = hit('.nodebox') || hit('.qitem') || hit('.tl-row');
  if (nb){ SEL = +nb.dataset.seq; ATT = {seq:null, idx:0, raw:false};
    const p = document.getElementById('edgePop'); if (p) p.remove();
    if (VIEW === 'graph'){ renderGraph(SC, SEL); applyZoom(); } else { renderTimeline(SC, SEL); applyTlZoom(); }
    renderDetail(SC, SEL); return; }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){
    const p = document.getElementById('edgePop');
    if (p) p.remove(); else if (SEL != null){ SEL = null; render(); }
  }
});
addEventListener('resize', () => { if (VIEW==='graph' && SC.key==='scale') fitZoom(); });

setScene(SC.key);
</script>
</body>
</html>
