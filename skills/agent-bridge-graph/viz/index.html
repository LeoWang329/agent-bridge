<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>graph 观测台 · 只读实时观察</title>
<style>
/* ============================================================
   graph 观测台 · 只读实时观测
   零外部请求 · 系统字体 · 内联 SVG · 浅/深色跟随系统(可手动覆盖)
   token / 卡片 / 连接 / 主题 与「圆桌观察台」「Loop 观察台」同源
   ============================================================ */

:root{
  --bg:#eef1f5; --canvas:#f6f8fb; --surface:#ffffff; --surface-2:#f1f4f8;
  /* --faint 是全站 10–11.5px 小字的颜色,必须过 4.5:1(#7d8b9b 只有 3.48:1) */
  --ink:#16202c; --ink-soft:#4a5765; --faint:#5c6b7c; --line:#e2e8f0; --line-2:#cdd6e2;

  --accent:#3061d6;      /* 一般强调 / 链接 / 运行中 */
  --c-ok:#0f875b;        /* 顺利跑完 */
  --c-contract:#c2610c;  /* 输出格式不合格 */
  --c-timeout:#b0730a;   /* 超时 */
  --c-fail:#c23d3d;      /* 引擎报错 */
  --c-reject:#5a6b80;    /* 被拒绝:中性,利落,不像事故 */
  --c-alert:#8a5600;     /* unknown:警戒(斜纹),不是"更红" */
  --c-lost:#3a4552;      /* abandoned:线索断了 */
  --c-unlog:#6b5aa6;     /* 记录不完整 */

  --e-codex:#5457d6; --e-omp:#0f875b; --e-claude:#c2610c; --e-cursor:#2b8ca6; --e-kimi:#a34b8f;

  --shadow:0 1px 2px rgba(16,32,48,.05), 0 6px 18px -12px rgba(16,32,48,.22);
  --shadow-lift:0 2px 6px rgba(16,32,48,.07), 0 14px 34px -18px rgba(16,32,48,.30);
  --radius:12px;
  --mono: ui-monospace,"Cascadia Code","SFMono-Regular","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;

  --on-solid:#ffffff;              /* 实底徽标上的字色 */
  /* 警戒斜纹:unknown 专用。明暗两种主题下都是同一套配色——警戒不跟随主题 */
  --hz-ink:#1a1206; --hz-edge:#6d4400; --hz-warn:#f2c14e;
  /* 原型演示外壳:不属于产品界面,固定深色,不随产品主题变化 */
  --proto-bg:#11161d; --proto-fg:#93a3b6; --proto-line:#222c38; --proto-ink:#0b0f15;
  --proto-btn-fg:#b9c6d6; --proto-btn-bg:#171e27; --proto-btn-line:#2a3644;
  --proto-btn-hover:#3d4c5e; --proto-on:#e7eef6;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --canvas:#0e131b; --surface:#141b24; --surface-2:#1a222e;
  --ink:#e7eef6; --ink-soft:#a4b2c2; --faint:#8798a9; --line:#232d3a; --line-2:#313d4d;
  --accent:#6e97f7; --c-ok:#42cf95; --c-contract:#f0953f; --c-timeout:#f2c14e; --c-fail:#ef6a6a;
  --c-reject:#8695a8; --c-alert:#e8b34a; --c-lost:#c3ccd8; --c-unlog:#b0a2e8;
  --e-codex:#8f92f2; --e-omp:#42cf95; --e-claude:#f0953f; --e-cursor:#5cc0dd; --e-kimi:#e089c6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,.8);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0b0f15; --canvas:#0e131b; --surface:#141b24; --surface-2:#1a222e;
    --ink:#e7eef6; --ink-soft:#a4b2c2; --faint:#8798a9; --line:#232d3a; --line-2:#313d4d;
    --accent:#6e97f7; --c-ok:#42cf95; --c-contract:#f0953f; --c-timeout:#f2c14e; --c-fail:#ef6a6a;
    --c-reject:#8695a8; --c-alert:#e8b34a; --c-lost:#c3ccd8; --c-unlog:#b0a2e8;
    --e-codex:#8f92f2; --e-omp:#42cf95; --e-claude:#f0953f; --e-cursor:#5cc0dd; --e-kimi:#e089c6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 18px 40px -20px rgba(0,0,0,.8);
  }
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 480px at 50% -180px, color-mix(in oklab,var(--accent) 7%, var(--bg)), transparent 70%), var(--bg);
  color:var(--ink); font:14px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; flex-direction:column; overflow:hidden;
}
a{color:var(--accent)}
::selection{background:color-mix(in oklab,var(--accent) 26%, transparent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.scroll{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--canvas)}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- 原型演示外壳(不属于产品界面) ---------- */
.protobar{
  flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 16px; background:var(--proto-bg); color:var(--proto-fg);
  border-bottom:1px solid var(--proto-line); font:11.5px/1 var(--mono);
}
.protobar .pb-tag{
  color:var(--proto-ink); background:var(--proto-fg); border-radius:4px; padding:3px 6px; font-weight:700; letter-spacing:.04em;
}
.protobar .pb-hint{opacity:.75}
.protobar .pb-sp{flex:1 1 auto}
.scenes{display:flex;flex-wrap:wrap;gap:5px}
.scene-btn{
  font:11.5px/1 var(--mono); color:var(--proto-btn-fg); padding:5px 9px; border-radius:6px;
  border:1px solid var(--proto-btn-line); background:var(--proto-btn-bg); white-space:nowrap;
}
.scene-btn:hover{border-color:var(--proto-btn-hover);color:var(--proto-on)}
.scene-btn[aria-pressed="true"]{background:var(--proto-on);color:var(--proto-bg);border-color:var(--proto-on);font-weight:700}

/* ---------- 应用外框 ---------- */
.app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* ---------- A 顶栏 ---------- */
.topbar{
  flex:0 0 auto; background:color-mix(in oklab,var(--surface) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;white-space:nowrap;margin:0;letter-spacing:0}
.brand .glyph{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;color:var(--on-solid);
  background:linear-gradient(150deg,var(--e-codex),var(--accent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
}
.brand .glyph svg{width:15px;height:15px}
.runid{font:11.5px/1 var(--mono);color:var(--faint);border-left:1px solid var(--line-2);padding-left:11px;white-space:nowrap}
.tb-sp{flex:1 1 auto}

.runpill{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
  max-width:46ch;
}
.runpill .dotp{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.runpill[data-r="running"]{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line));background:color-mix(in oklab,var(--accent) 10%,var(--surface))}
.runpill[data-r="running"] .dotp{background:var(--accent);animation:pulse 1.8s ease-in-out infinite}
.runpill[data-r="ended"]{color:var(--c-ok);border-color:color-mix(in oklab,var(--c-ok) 40%,var(--line));background:color-mix(in oklab,var(--c-ok) 10%,var(--surface))}
.runpill[data-r="ended"] .dotp{background:var(--c-ok)}
.runpill[data-r="ended_failed"]{color:var(--c-fail);border-color:color-mix(in oklab,var(--c-fail) 40%,var(--line));background:color-mix(in oklab,var(--c-fail) 10%,var(--surface))}
.runpill[data-r="ended_failed"] .dotp{background:var(--c-fail)}
.runpill[data-r="no_finish"]{
  color:var(--surface);background:var(--c-lost);border-color:var(--c-lost);
}
.runpill[data-r="no_finish"] .dotp{background:var(--surface);opacity:.85}
.runpill[data-r="log_broken_ended"],.runpill[data-r="log_broken_unknown"]{
  color:var(--surface);background:var(--c-unlog);border-color:var(--c-unlog);
}
.runpill[data-r="log_broken_ended"] .dotp,.runpill[data-r="log_broken_unknown"] .dotp{background:var(--surface);opacity:.85}
.runpill[data-r="waiting"]{color:var(--faint)}
.runpill[data-r="replaying"]{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line));background:color-mix(in oklab,var(--accent) 10%,var(--surface))}
.runpill[data-r="replaying"] .dotp{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}

.counts{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.count{
  display:inline-flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:7px;
  font:11.5px/1 var(--mono);color:var(--faint);white-space:nowrap;
}
.count b{font-size:13px;font-weight:700;color:var(--ink-soft);min-width:1.2em;text-align:right;font-variant-numeric:tabular-nums}
.count[data-k="running"] b{color:var(--accent)} .count[data-k="queued"] b{color:var(--faint)}
.count[data-k="ok"] b{color:var(--c-ok)} .count[data-k="fail"] b{color:var(--c-fail)}
.count[data-k="unknown"] b{color:var(--c-alert)} .count[data-k="abandoned"] b{color:var(--c-lost)}
.count[data-k="rejected"] b{color:var(--c-reject)} .count[data-k="unlogged"] b{color:var(--c-unlog)}
.counts-note{font:11px/1.4 var(--mono);color:var(--c-unlog);padding:4px 8px;border:1px dashed color-mix(in oklab,var(--c-unlog) 45%,var(--line));border-radius:7px;background:color-mix(in oklab,var(--c-unlog) 7%,var(--surface))}

.conn{
  display:inline-flex;align-items:center;gap:7px;font:11.5px/1 var(--mono);color:var(--faint);
  padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap;
}
.conn .led{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.conn[data-s="live"] .led{background:var(--c-ok);box-shadow:0 0 0 3px color-mix(in oklab,var(--c-ok) 26%,transparent)}
.conn[data-s="live"]{color:var(--ink-soft)}
.conn[data-s="reconnect"] .led{background:var(--c-timeout);animation:blink 1s steps(2) infinite}
.conn[data-s="reconnect"]{color:var(--c-timeout);border-color:color-mix(in oklab,var(--c-timeout) 40%,var(--line))}
.conn[data-s="down"] .led{background:var(--c-fail)}
.conn[data-s="down"]{color:var(--c-fail);border-color:color-mix(in oklab,var(--c-fail) 40%,var(--line))}
.conn[data-s="replay"] .led{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.conn[data-s="replay"]{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line))}
.theme-toggle{
  font:11.5px/1 var(--sans);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
}
.theme-toggle:hover{border-color:var(--line-2);color:var(--ink)}
.theme-toggle svg{width:14px;height:14px}

/* ---------- 横幅 ---------- */
.banners{flex:0 0 auto;padding:0 20px}
.banners:not(:empty){padding:10px 20px 0}
.banner{
  display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:10px;margin-bottom:8px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-size:13px;
}
.banner .b-ic{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--surface);background:var(--faint)}
.banner .b-ic svg{width:13px;height:13px}
.banner .b-t{font-weight:650;color:var(--ink)}
.banner .b-d{margin-top:3px;line-height:1.6;text-wrap:pretty}
.banner[data-v="lost"]{background:color-mix(in oklab,var(--c-lost) 9%,var(--surface));border-color:color-mix(in oklab,var(--c-lost) 35%,var(--line))}
.banner[data-v="lost"] .b-ic{background:var(--c-lost)}
.banner[data-v="unlog"]{background:color-mix(in oklab,var(--c-unlog) 10%,var(--surface));border-color:color-mix(in oklab,var(--c-unlog) 40%,var(--line))}
.banner[data-v="unlog"] .b-ic{background:var(--c-unlog)}
.banner[data-v="conn"]{background:color-mix(in oklab,var(--c-timeout) 12%,var(--surface));border-color:color-mix(in oklab,var(--c-timeout) 42%,var(--line))}
.banner[data-v="conn"] .b-ic{background:var(--c-timeout);animation:pulse 1.6s ease-in-out infinite}
.banner[data-v="info"] .b-ic{background:var(--accent)}
.banner[data-v="info"]{background:color-mix(in oklab,var(--accent) 8%,var(--surface));border-color:color-mix(in oklab,var(--accent) 32%,var(--line))}

/* ---------- 工作区 ---------- */
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 432px;gap:14px;padding:12px 20px 14px}
.workspace[data-detail="closed"]{grid-template-columns:minmax(0,1fr) 0}
@media (min-width:1800px){ .workspace{grid-template-columns:minmax(0,1fr) 500px} }

.panel{background:var(--canvas);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* B 主视图 */
.viewbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.vtabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.vtab{font:12.5px/1 var(--sans);padding:6px 12px;color:var(--ink-soft);border-right:1px solid var(--line)}
.vtab:last-child{border-right:0}
.vtab[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:inset 0 -2px 0 var(--ink)}
.vtab[disabled]{opacity:.42;cursor:not-allowed}
.vb-sp{flex:1 1 auto}
.legend{display:flex;align-items:center;gap:12px;font:11px/1 var(--mono);color:var(--faint);flex-wrap:wrap}
.legend i{display:inline-flex;align-items:center;gap:5px;font-style:normal}
.lg-line{width:22px;height:0;border-top:1.6px solid var(--ink-soft)}
.lg-dash{width:22px;height:0;border-top:1.6px dashed var(--faint)}
.zoom{display:inline-flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.zoom button{font:12.5px/1 var(--mono);padding:6px 9px;color:var(--ink-soft)}
.zoom button:hover{color:var(--ink);background:var(--surface)}
.zoom .z-val{font:11px/1 var(--mono);color:var(--faint);padding:0 6px;min-width:4ch;text-align:center}

.gwrap{flex:1 1 auto;min-height:0;position:relative;overflow:auto;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px, var(--canvas)}
.gcanvas{position:relative;transform-origin:0 0;padding:22px}
.gedges{position:absolute;inset:0;overflow:visible;pointer-events:none}
.gedges path{fill:none;pointer-events:stroke;cursor:pointer}
/* ⚠️ 命中区**就是那条线本身**,而线宽 1.4px 又是虚线 —— 实测:曲线的数学中点都点不中
   (正落在虚线空隙里),瞄准 ±6px 的 49 个落点只中 4 次,命中率 8%。
   图例上写着「可点开看依据」,实际等于点不开。所以另铺一条**透明的粗线**当热区:
   看不见、不改观感,但手指和鼠标够得着;它还带 tabindex,键盘也到得了(<path> 本身不可聚焦)。 */
.gedges path.ehit{stroke:#000;stroke-opacity:0;stroke-width:18;stroke-dasharray:none;marker-end:none}
.gedges path.ehit:focus-visible{stroke:var(--accent);stroke-opacity:.32;outline:none}

/* 环节卡 */
.nodebox{
  position:absolute;width:216px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  padding:9px 10px;box-shadow:var(--shadow);text-align:left;display:block;transition:box-shadow .16s,border-color .16s;
}
.nodebox:hover{box-shadow:var(--shadow-lift);border-color:var(--faint)}
.nodebox[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklab,var(--accent) 32%,transparent),var(--shadow-lift)}
.nb-top{display:flex;align-items:center;gap:7px;min-width:0}
.nb-id{font-weight:650;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.nb-seq{font:10px/1 var(--mono);color:var(--faint);flex:0 0 auto}
.nb-bot{display:flex;align-items:center;gap:7px;margin-top:7px;min-width:0;overflow:hidden}
.nb-st{display:inline-flex;align-items:center;gap:5px;font:11px/1 var(--sans);font-weight:600;padding:3px 7px;border-radius:5px;white-space:nowrap;flex:0 0 auto}
.nb-t{margin-left:auto;font:10.5px/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;
  min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-top>.chip,.nb-bot>.chip{flex:0 0 auto}

.badge{
  width:20px;height:20px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;color:var(--on-solid);
  font:700 10px/1 var(--mono);background:var(--ec,var(--faint));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.badge.sm{width:17px;height:17px;font-size:10px;border-radius:5px}
.chip{font:10px/1 var(--mono);padding:3px 5px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.chip.w{color:var(--e-codex);border-color:color-mix(in oklab,var(--e-codex) 38%,var(--line));background:color-mix(in oklab,var(--e-codex) 9%,var(--surface))}
/* 复用是角标而不是另一种结局:中性徽章 + ↺ 字形,绝不换成另一个状态色 */
.chip.reuse{color:var(--ink);border-color:var(--ink-soft);background:var(--surface);font-weight:700}

/* 状态视觉:7 档 + 阶段,语义各不相同 */
.st-discovered{color:var(--faint);background:var(--surface-2);border:1px dashed var(--line-2)}
.st-queued{color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-2)}
.st-running{color:var(--surface);background:var(--accent)}
.st-running .dt{width:6px;height:6px;border-radius:50%;background:var(--surface);animation:pulse 1.4s ease-in-out infinite}
.st-ok{color:var(--c-ok);background:color-mix(in oklab,var(--c-ok) 11%,var(--surface));border:1px solid color-mix(in oklab,var(--c-ok) 30%,var(--line))}
.st-contract_error{color:var(--c-contract);background:color-mix(in oklab,var(--c-contract) 13%,var(--surface));border:1px solid color-mix(in oklab,var(--c-contract) 42%,var(--line))}
.st-timeout{color:var(--c-timeout);background:color-mix(in oklab,var(--c-timeout) 13%,var(--surface));border:1px solid color-mix(in oklab,var(--c-timeout) 42%,var(--line))}
.st-backend_failed{color:var(--surface);background:var(--c-fail)}
.st-rejected{color:var(--c-reject);background:var(--surface);border:1px solid var(--c-reject);border-style:solid}
.st-unknown{
  color:var(--hz-ink);font-weight:750;border:1px solid var(--hz-edge);
  background:repeating-linear-gradient(-45deg,var(--hz-warn) 0 7px,var(--hz-ink) 7px 8px,var(--hz-warn) 8px 14px);
}
.st-abandoned{color:var(--surface);background:var(--c-lost);border:1px dashed var(--surface)}
.st-unlogged{color:var(--surface);background:var(--c-unlog)}

.nodebox[data-st="discovered"]{border-style:dashed;opacity:.72;box-shadow:none}
.nodebox[data-st="queued"]{background:var(--surface-2);box-shadow:none}
.nodebox[data-st="running"]{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 12%,transparent),var(--shadow-lift)}
.nodebox[data-st="unknown"]{border-color:var(--c-alert);border-width:1.5px}
.nodebox[data-st="abandoned"]{border-style:dashed;border-color:var(--c-lost)}
.nodebox[data-st="backend_failed"]{border-color:color-mix(in oklab,var(--c-fail) 50%,var(--line))}
.nodebox[data-st="unlogged"]{border-style:dashed;border-color:color-mix(in oklab,var(--c-unlog) 55%,var(--line))}

/* 运行中的产出尾巴 */
/* 固定 2 行,按行边界收口——绝不在半行处硬切,也绝不撑破卡片 */
.nb-tail{margin-top:6px;font:10px/1.4 var(--mono);color:var(--faint);
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;
  max-height:28px;overflow:hidden;
  border-top:1px dashed var(--line);padding-top:5px;overflow-wrap:anywhere}

/* 排队折叠带 */
.qband{
  position:absolute;display:flex;flex-direction:column;gap:8px;
  border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);padding:11px 12px;
}
.qband-h{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
.qband-h b{font-weight:700;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
.qband-toggle{font:11.5px/1 var(--sans);color:var(--ink-soft);margin-left:auto;padding:4px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface)}
.qband-toggle:hover{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line))}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;max-height:260px;overflow:auto}
.qitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12.5px;text-align:left;min-width:0}
.qitem .qi-id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.qitem .qi-t{font:10px/1 var(--mono);color:var(--faint);flex:0 0 auto;font-variant-numeric:tabular-nums}
.qitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklab,var(--accent) 26%,transparent)}

/* 边解释气泡 */
.edgepop{
  position:absolute;z-index:9;max-width:300px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:9px;box-shadow:var(--shadow-lift);padding:10px 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;
}
.edgepop b{color:var(--ink);display:block;margin-bottom:4px;font-size:12.5px}
.edgepop code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.edgepop .x{position:absolute;top:5px;right:8px;color:var(--faint);font-size:14px;line-height:1}

/* 时间轴 */
/* 纵向:整块滚动,刻度吸顶、图例吸底。
   横向:1× 时整程恰好铺满容器;放大后 .tl-inner 按倍数变宽并可左右滚动,
        标签列吸在左边,否则滚到右边就不知道哪根条是谁的。 */
.tlwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:0;--lab:clamp(150px,20vw,236px);--tlz:1}
.tl-inner{width:calc(var(--lab) + (100% - var(--lab)) * var(--tlz));min-width:100%;padding-bottom:10px}
.tl-axis{position:sticky;top:0;z-index:3;display:flex;background:var(--surface);border-bottom:1px solid var(--line);padding:7px 14px 7px 0}
.tl-axis .tl-lab{flex:0 0 auto;z-index:4;background:var(--surface)}
.tl-ticks{flex:1 1 auto;position:relative;height:15px}
.tl-tick{position:absolute;top:0;font:10px/1 var(--mono);color:var(--faint);transform:translateX(-50%);white-space:nowrap}
.tl-tick::before{content:"";position:absolute;left:50%;top:16px;width:1px;height:6px;background:var(--line-2)}
/* width:100% 不能省:.tl-row 是 <button>,而表单控件的 width:auto 在所有浏览器里
   都是 shrink-to-fit,display:flex 也改不了。缺了它轨道会被压成 0 宽,
   里面所有 left:X% 的色条就全部塌到最左边。 */
.tl-row{width:100%;text-align:left;display:flex;align-items:center;gap:0;padding:3px 14px 3px 0;
  border-bottom:1px solid color-mix(in oklab,var(--line) 55%,transparent)}
.tl-row:hover{background:color-mix(in oklab,var(--accent) 5%,transparent)}
.tl-row[aria-pressed="true"]{background:color-mix(in oklab,var(--accent) 10%,transparent)}
.tl-lab{flex:0 0 auto;width:var(--lab);position:sticky;left:0;z-index:2;background:var(--canvas);
  border-right:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px 0 14px;min-width:0}
.tl-row:hover .tl-lab{background:color-mix(in oklab,var(--accent) 5%,var(--canvas))}
.tl-row[aria-pressed="true"] .tl-lab{background:color-mix(in oklab,var(--accent) 10%,var(--canvas))}
.tl-lab .tl-id{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.tl-track{flex:1 1 auto;min-width:0;position:relative;height:26px}
.tl-seg{position:absolute;top:5px;height:16px;border-radius:4px}
.tl-seg.q{background:repeating-linear-gradient(90deg,color-mix(in oklab,var(--faint) 24%,var(--surface)) 0 5px,color-mix(in oklab,var(--faint) 12%,var(--surface)) 5px 10px);border:1px solid var(--line-2)}
.tl-seg.run{background:var(--sc,var(--accent));opacity:.9}
.tl-seg.run.dim{opacity:.55}
.tl-seg.open{border-right:2px dashed var(--surface)}
/* right:0 把说明文字约束在轨道内 —— 否则窄容器下它会顶出去,凭空撑出一条横向滚动 */
.tl-note{position:absolute;top:5px;right:0;height:16px;display:flex;align-items:center;font:10px/1 var(--mono);
  color:var(--faint);padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 图例是面板的固定页脚,不在滚动容器里 —— sticky 不会移出文档流,
   内容不够高时它会停在最后一行下面、把剩余面板高度全留成空白。 */
.tl-key{flex:0 0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:9px 14px;
  font:11px/1.5 var(--mono);color:var(--faint);border-top:1px solid var(--line);background:var(--surface)}
.tl-key[hidden]{display:none}

/* 横向平移:内容真的超出时才给抓手光标,拖动中禁掉选中,免得拖出一片高亮 */
.gwrap[data-scrollx="1"],.tlwrap[data-scrollx="1"]{cursor:grab}
.gwrap.panning,.tlwrap.panning{cursor:grabbing;user-select:none;-webkit-user-select:none}
.tl-key i{display:inline-flex;align-items:center;gap:6px;font-style:normal}
.tl-key .sw{width:20px;height:11px;border-radius:3px}

/* 空态 */
.empty{margin:auto;max-width:460px;text-align:center;color:var(--faint);padding:40px 20px}
.empty .e-ic{width:46px;height:46px;margin:0 auto 15px;border:1.5px dashed var(--line-2);border-radius:14px;display:grid;place-items:center}
.empty .e-ic svg{width:22px;height:22px;opacity:.7}
.empty h2{margin:0 0 7px;font-size:15px;font-weight:650;color:var(--ink-soft)}
.empty p{margin:0 0 10px;font-size:13px;line-height:1.65}
.empty .dots span{animation:blink 1.4s infinite}
.empty .dots span:nth-child(2){animation-delay:.2s} .empty .dots span:nth-child(3){animation-delay:.4s}

/* ---------- C 详情面板 ---------- */
.detail{overflow:hidden}
.detail[hidden]{display:none}
.d-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:0 0 40px}
.d-head{flex:0 0 auto;position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
.d-title{display:flex;align-items:center;gap:8px;min-width:0}
.d-title .d-id{font-weight:700;font-size:15px;margin:0;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-close{margin-left:auto;color:var(--faint);padding:4px 7px;border-radius:6px;font-size:15px;line-height:1}
.d-close:hover{background:var(--surface-2);color:var(--ink)}
.d-sub{margin-top:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}

.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{background:var(--surface);padding:8px 14px;min-width:0}
.fact .k{font:10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);display:block}
.fact .v{margin-top:4px;font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.fact .v .u{color:var(--faint);font-size:11.5px;font-family:var(--mono)}
.fact.wide{grid-column:1/-1}
.fact .v.unknownv{color:var(--faint);font-style:normal}

.sec{border-bottom:1px solid var(--line);padding:13px 14px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.02em;margin:0 0 9px}
.sec-h .hint{font-weight:400;font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.sec p{margin:0 0 8px;font-size:13px;line-height:1.68;color:var(--ink-soft);text-wrap:pretty}
.sec p:last-child{margin-bottom:0}
.sec p b{color:var(--ink)}

.kv{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.kv:last-child{border-bottom:0}
.kv .k{flex:0 0 auto;width:82px;color:var(--faint);font:10.5px/1.5 var(--mono);letter-spacing:.05em}
.kv .v{flex:1 1 auto;min-width:0;color:var(--ink);overflow-wrap:anywhere}

/* 强调色只留给「运行中 / 选中 / 焦点」三件事;工具按钮一律中性,悬停才升到强调色 */
.copy{display:inline-flex;align-items:center;gap:5px;font:11px/1 var(--mono);color:var(--ink-soft);
  border:1px solid var(--line-2);border-radius:6px;padding:3px 7px;background:var(--surface);vertical-align:middle}
.copy:hover{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line));background:color-mix(in oklab,var(--accent) 8%,var(--surface))}
.copy svg{width:11px;height:11px}
.copy.done{color:var(--c-ok);border-color:color-mix(in oklab,var(--c-ok) 40%,var(--line))}
.path{font:11.5px/1.55 var(--mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;overflow-wrap:anywhere;display:block;margin:0 0 7px}

/* 告警块 */
.alertbox{border-radius:9px;padding:11px 12px;margin:0 0 10px;font-size:12.5px;line-height:1.62}
.alertbox .ab-t{font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.alertbox .ab-t svg{width:14px;height:14px;flex:0 0 auto}
.alertbox[data-v="alert"]{background:color-mix(in oklab,var(--c-alert) 13%,var(--surface));border:1.5px solid var(--c-alert);color:var(--ink)}
.alertbox[data-v="alert"] .ab-t{color:var(--c-alert)}
.alertbox[data-v="hazard"]{border:1.5px solid var(--hz-edge);background:color-mix(in oklab,var(--c-alert) 10%,var(--surface));color:var(--ink)}
.alertbox[data-v="hazard"]::before{content:"";display:block;height:6px;margin:-11px -12px 9px;border-radius:8px 8px 0 0;
  background:repeating-linear-gradient(-45deg,var(--hz-warn) 0 8px,var(--hz-ink) 8px 9px,var(--hz-warn) 9px 16px)}
.alertbox[data-v="lost"]{background:color-mix(in oklab,var(--c-lost) 9%,var(--surface));border:1px solid color-mix(in oklab,var(--c-lost) 40%,var(--line));color:var(--ink)}
.alertbox[data-v="lost"] .ab-t{color:var(--c-lost)}
.alertbox[data-v="reject"]{background:var(--surface-2);border:1px solid var(--c-reject);color:var(--ink)}
.alertbox[data-v="reject"] .ab-t{color:var(--c-reject)}
.alertbox[data-v="ok"]{background:color-mix(in oklab,var(--c-ok) 9%,var(--surface));border:1px solid color-mix(in oklab,var(--c-ok) 32%,var(--line))}
.alertbox[data-v="ok"] .ab-t{color:var(--c-ok)}
.alertbox[data-v="quiet"]{background:var(--surface-2);border:1px solid var(--line)}
.alertbox[data-v="unlog"]{background:color-mix(in oklab,var(--c-unlog) 10%,var(--surface));border:1px solid color-mix(in oklab,var(--c-unlog) 40%,var(--line))}
.alertbox[data-v="unlog"] .ab-t{color:var(--c-unlog)}
.alertbox .todo{margin:8px 0 0;padding-left:17px}
.alertbox .todo li{margin:3px 0}

/* 六态资产 */
.asset{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.asset:last-child{border-bottom:0}
.asset .a-n{flex:0 0 auto;width:78px;color:var(--ink-soft);font-weight:600}
.asset .a-b{flex:1 1 auto;min-width:0}
.asset .a-why{color:var(--faint);font-size:11.5px;line-height:1.55;margin-top:3px;overflow-wrap:anywhere}
.asset .a-why code{font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--ink-soft)}
/* 「取回来的字节与记录对不上」——这一条不能长得跟旁边的灰色注脚一样。 */
.asset .a-why[data-warn]{color:var(--c-fail);border-left:2px solid var(--c-fail);padding-left:7px}
.a-open{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line-2)}
.asset:hover .a-open{color:var(--accent);border-bottom-color:currentColor}
.a-na{color:var(--faint)}
.a-flag{display:inline-flex;align-items:center;gap:5px;font:10.5px/1 var(--mono);padding:3px 6px;border-radius:5px;white-space:nowrap}
.a-flag[data-s="unavailable"]{color:var(--c-contract);background:color-mix(in oklab,var(--c-contract) 12%,var(--surface));border:1px solid color-mix(in oklab,var(--c-contract) 40%,var(--line))}
.a-flag[data-s="pending"]{color:var(--accent);background:color-mix(in oklab,var(--accent) 10%,var(--surface));border:1px solid color-mix(in oklab,var(--accent) 34%,var(--line))}
.a-flag[data-s="gone"]{color:var(--c-timeout);background:color-mix(in oklab,var(--c-timeout) 12%,var(--surface));border:1px solid color-mix(in oklab,var(--c-timeout) 40%,var(--line))}
.a-flag[data-s="unlogged"]{color:var(--c-unlog);background:color-mix(in oklab,var(--c-unlog) 11%,var(--surface));border:1px solid color-mix(in oklab,var(--c-unlog) 40%,var(--line))}
.a-flag[data-s="na"]{color:var(--faint);background:var(--surface-2);border:1px solid var(--line)}

/* 有界摘要 */
.bounded{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.bounded pre{margin:0;padding:9px 11px;font:11.5px/1.6 var(--mono);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface)}
.bounded .bd-gap{display:flex;align-items:center;gap:9px;padding:6px 11px;font:10.5px/1.4 var(--mono);color:var(--c-contract);
  background:repeating-linear-gradient(-45deg,color-mix(in oklab,var(--c-contract) 8%,var(--surface)) 0 8px,transparent 8px 16px);
  border-top:1px dashed var(--line-2);border-bottom:1px dashed var(--line-2)}
.bounded .bd-foot{display:flex;gap:12px;flex-wrap:wrap;padding:6px 11px;font:10.5px/1.4 var(--mono);color:var(--faint);background:var(--surface-2)}
.bounded .bd-lab{font:10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:5px 11px 0}

/* 尝试分段(可扩展,不写死两段) */
.segbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{font:11.5px/1 var(--sans);padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;border-color:var(--ink-soft);box-shadow:inset 0 -2px 0 var(--ink)}
.seg .sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:var(--faint);vertical-align:middle}
.seg[data-r="rejected"] .sdot{background:var(--c-contract)}
.seg[data-r="accepted"] .sdot{background:var(--c-ok)}

/* 折叠块 */
.fold{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;background:var(--surface);overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:9px 11px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--ink)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .caret{width:11px;height:11px;flex:0 0 auto;color:var(--faint);transition:transform .15s}
.fold[open]>summary .caret{transform:rotate(90deg)}
.fold>summary .sm{margin-left:auto;font:10.5px/1 var(--mono);color:var(--faint);font-weight:400}
.fold-body{padding:0 11px 11px;border-top:1px solid var(--line);padding-top:10px}

/* Markdown 渲染 */
.md{font-size:13px;line-height:1.72;color:var(--ink);overflow-wrap:anywhere}
.md h1,.md h2,.md h3{margin:14px 0 7px;line-height:1.4;font-weight:700}
.md h1{font-size:15px} .md h2{font-size:14px} .md h3{font-size:13px;color:var(--ink-soft)}
.md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0}
.md p{margin:0 0 9px;color:var(--ink-soft)}
.md ul,.md ol{margin:0 0 9px;padding-left:19px;color:var(--ink-soft)}
.md li{margin:3px 0}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.md strong{color:var(--ink);font-weight:700}
.md blockquote{margin:0 0 9px;padding:2px 0 2px 11px;border-left:2px solid var(--line-2);color:var(--faint)}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.codefold{border:1px solid var(--line-2);border-radius:7px;margin:0 0 9px;background:var(--surface-2);overflow:hidden}
.codefold>summary{list-style:none;cursor:pointer;padding:6px 9px;font:11px/1 var(--mono);color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.codefold>summary::-webkit-details-marker{display:none}
.codefold pre{margin:0;padding:9px;font:11.5px/1.6 var(--mono);overflow:auto;max-height:340px;background:var(--surface);border-top:1px solid var(--line)}
.raw{margin:0;padding:11px;font:11.5px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;max-height:420px;overflow:auto;color:var(--ink)}
.viewswitch{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:auto}
.viewswitch button{font:10.5px/1 var(--mono);padding:5px 8px;color:var(--faint);border-right:1px solid var(--line)}
.viewswitch button:last-child{border-right:0}
.viewswitch button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:700}
.totop{position:sticky;bottom:8px;float:right;margin:6px 0 0;font:10.5px/1 var(--mono);color:var(--faint);
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px}
.totop:hover{color:var(--ink);border-color:var(--line-2)}

/* 改动清单 */
.difflist{border:1px solid var(--line);border-radius:8px;max-height:236px;overflow:auto;background:var(--surface)}
.diffrow{display:flex;align-items:center;gap:8px;padding:5px 9px;border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);font:11.5px/1.5 var(--mono)}
.diffrow:last-child{border-bottom:0}
.df-t{flex:0 0 auto;width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font:700 10px/1 var(--mono);color:var(--on-solid)}
.df-t[data-t="A"]{background:var(--c-ok)} .df-t[data-t="M"]{background:var(--accent)}
.df-t[data-t="D"]{background:var(--c-fail)} .df-t[data-t="R"]{background:var(--c-timeout)}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.88)}}

<script>
/* ============================================================
   1. 常量与词表
   ============================================================ */
const ENGINES = {
  codex:  {short:'Cx', v:'--e-codex'},
  omp:    {short:'Om', v:'--e-omp'},
  claude: {short:'Cl', v:'--e-claude'},
  cursor: {short:'Cu', v:'--e-cursor'},
  kimi:   {short:'Ki', v:'--e-kimi'},
};

/* 七档结局 + 三个阶段 + 一个「记录不完整」。short 上卡片，long 进详情。 */
const STATUS = {
  discovered:     {short:'已发现',    long:'已发现 · 正在做本地准备'},
  queued:         {short:'排队中',    long:'排队中 · 已进入本地队列，尚未派给 AI'},
  running:        {short:'运行中',    long:'运行中 · 已拿到执行名额'},
  ok:             {short:'完成',      long:'ok · 顺利跑完'},
  contract_error: {short:'格式不合格', long:'contract_error · 跑完了，但输出格式不合格'},
  timeout:        {short:'超时',      long:'timeout · 超时被打断'},
  backend_failed: {short:'引擎报错',   long:'backend_failed · 引擎明确报错'},
  /* ⚠️ 唯一一个「既有回执、又向调用方抛了异常」的结局：AI 那边**跑完了**，
        是**编排那段 JS** 自己炸了。所以它是一个有终态、有回执、有产出的节点，
        不是失败态的变体 —— 别把人指到后端那边去查。 */
  callback_error: {short:'编排出错',   long:'callback_error · 各轮都跑完了，是编排那段 JS 自己抛了异常'},
  rejected:       {short:'被拒绝',    long:'被拒绝 · 还没开跑就被本地挡下了'},
  unknown:        {short:'说不清',    long:'unknown · 这个环节干没干完，说不清'},
  abandoned:      {short:'未见结局',   long:'abandoned · 没有看到这个环节的结局'},
  unlogged:       {short:'状态未记录', long:'记录从某处起不完整，这个环节的状态未知'},
};

/* 「拿不到」的已知原因码 —— 开放清单，未见过的原因码走兜底 */
/* ⚠️ 键用 wire 的**原样字面量**（kebab），reducer 里不做任何大小写转换 ——
      转换层正是「没见过的 code」最容易被静默吃掉的地方。 */
const UNAVAIL = {
  'archive-root-failed': '这个环节自己的归档目录没建起来，于是它的东西一样都没落下。',
  'write-failed':        '这一项写盘失败。',
  'source-missing':      '源头就没有可拷的东西。',
  'sha-failed':          '拷下来了，但算不出指纹 —— 所以不能当成「拿得到」（指纹是复用与防篡改的判据）。',
  /* ⚠️ **别一口咬定"这是当时的选择、不是故障"。** 这个 code 今天有好几种成因：
        原运行没开可视化（确实是选择）、复用时 n≥2 的重说提示这一次没有、输入指纹对不上
        因而拒绝落盘（那是**保护**）、以及产出原件当时**复制失败**（那就是故障）。
        wire 上分不出是哪一种，所以这里只说**这一层拿不到正文、指纹还在**，
        把"是不是故障"留给人判断 —— 说满了会在真出故障时反过来安慰用户。 */
  'fingerprint-only':    '这一层<b>拿不到正文，只留下了指纹</b>。成因可能是当初没开可视化、这一项本次没有原文可复原、或者当时那次复制没成 —— 记录里分不出是哪一种。',
  /* ⚠️ 这个 code 是**页面自己造的**（wire 上没有）：记录说"东西在"，却没给可打开的位置，
        或者没给指纹与字节数。**那等于没有** —— 指纹是"页面上这份 = 磁盘上那份"的唯一对证手段，
        缺了它，即使文件真在，这一份也不能当权威记录展示。 */
  'record-broken':       '记录说这一项在，却<b>缺了打开它所必需的东西</b>（位置、指纹或字节数）。东西可能真在磁盘上，但这一层没法证明打开的就是当时那一份，所以不给入口。',
  /* ⚠️ 字面量 unknown 与「没见过的 code」**必须是两句不同的话**：
        前者是「已知的未知」——生产方尝试过、也知道失败了，只是没分辨出是哪一类；
        后者是「这个版本的页面还不认识它」。混成一句就把两件事抹平了。 */
  'unknown':             '确实拿不到，但连原因都没分辨出来 —— 生产方尝试过、也知道失败了，只是没能分辨出是哪一类。',
};

/* 三档改动结论 —— 文案按 §4A 定死，不得改写 */
const OUTCOME = {
  delivered:    '已交付',
  'no-changes': '无改动',
  unknown:      '交付状态不明',
};

/* node:rejected 的**封闭六档**（键 = wire 的 phase 字面量）。

const REJECT = {
  lock: {
    t:'这个名字被占着',
    d:'另一个环节已经用了同一个 id，本地当场挡下，没有联系任何 AI。',

          '如果是前者，等它跑完；如果是后者，清掉残留再重跑。<b>两种处置完全相反，别猜。</b>'],
  },
  preflight: {
    t:'你的代码目录有没提交的改动',
    d:'开跑前的仓库体检没过，本地当场挡下，没有联系任何 AI。',
    todo:['这是你自己工作区的状态，没有任何东西被创建或残留。','提交或暂存后重跑即可。'],
  },
  'reuse-check': {

    todo:['没有任何东西被创建或残留。','要么关掉复用，要么核对上次那份结果是不是你想要的。'],
  },
  'workspace-setup': {
    t:'独立工作副本没建起来',
    d:'准备隔离目录时失败，本地当场挡下，没有联系任何 AI。',
    todo:['<b>可能有东西要管</b>：最常见的原因就是上次残留的工作副本或分支清不掉，那东西<b>可能还在</b>。',
          '也可能是这次建到一半失败、自动清理也没成功。<b>去下面这个预定位置看一眼。</b>'],
  },
  /* ⚠️ 下面两档**只可能出现在对话节点上**（runNode 没有回调，它那一轮在规范化阶段
        就校验完了，而那条路一个事件都不发）。 */
  'turn-validation': {
    /* ⚠️ 枚举名比它的实际语义窄，**别照名字起标题**：它涵盖①参数不合法
          ②用法/状态不允许（并发 turn() / fn 已返回才来 / 已被毒化 / 超 20 轮）。
          所以处置提示不写成「参数写错了」，正文一律**照抄 error**。 */
    t:'有 turn() 被当场拒了，一轮都没能进去',
    d:'调用过 turn()，但每一次都在**任何副作用之前**被挡下 —— 没有联系过任何 AI。',
    todo:['去看<b>那几次 turn() 是怎么调的</b>：可能是参数写错，<b>也可能是并发调用、fn 已经返回才来、这段对话已被毒化、或超过 20 轮</b>。',
          '下面那段是当时抛出来的原文，里面写着调了几次、最后一次没进去的原因。'],
  },
  'zero-turn': {
    t:'这段对话一轮都没跑（一次 turn() 都没调）',
    d:'回调跑完了，但一次 turn() 都没调用过 —— 没有联系过任何 AI，也不写空回执。',
    todo:['去看<b>编排那段 JS 为什么空转</b>：通常是条件分支把所有 turn() 都跳过了。',
          '⚠️ 这与「调过但每次都被拒」是两回事 —— 那种情况显示成上一档，处置完全不同。'],
  },
};

/* ============================================================
   2. 场景数据
   一个 scene = 一次运行的全部内容。nodeSeq 是唯一键;id 可以重复。
   ============================================================ */

扫描了 \`src/\` 下 214 个文件，按职责聚成四块：

const MD_PATCH_REPORT = `## 工作报告 · 会话续期竞态

/* ── 演示数据的展开步骤 ────────────────────────────────────────
   上面那些静态场景用 `attempts:[…]` + `scene:{…}` 这个**简写**声明「只有一轮」的节点;
   这里把简写展开成正式形状 `turns:[{key:'main', status, scene, attempts}]`。

   ⚠️ **这是演示数据的构造,不是渲染器的兼容层。**
   它只跑在 SCENES 这一个静态数组上,不在渲染路径里。渲染器只认 turns ——
   真实数据由 reducer 保证「每个节点都有 turns」(docs/EVENTS-graph.md §10.9 第 7 条:
   不给单轮节点留没有 turn 的旧路径)。如果哪天 reducer 漏了 turns,
   页面上就该看到它漏了,而不是被这里补上。 */
(function expandDemoTurns(){
  /* 节点结局 → 那一轮的结局。**只有前七个是轮真的会有的状态**;
     后面几个是节点级判别态(还没开跑 / 没看到结局 / 记录不全),
     轮这一层用最贴近的那一档表示。 */
  const T = {ok:'ok', contract_error:'contract_error', backend_failed:'backend_failed',
             timeout:'timeout', unknown:'unknown', running:'running', queued:'queued',
             discovered:'queued', callback_error:'ok', rejected:'not-started',
             abandoned:'unknown', unlogged:'unknown'};
  for (const sc of SCENES) for (const nd of (sc.nodes || [])){
    if (!nd.turns){
      nd.turns = [{key:'main', status: T[nd.status] || nd.status,
                   scene: nd.scene, sceneNone: nd.sceneNone, attempts: nd.attempts || []}];
    }
    delete nd.attempts; delete nd.scene; delete nd.sceneNone;   // 简写用完就抹掉,免得两份并存
    for (const t of nd.turns){
      if (!t.key) throw new Error('演示数据:轮缺 key ── '+nd.id);
      if (t.status == null) throw new Error('演示数据:轮缺 status ── '+nd.id+'/'+t.key);
    }
  }
})();

/* ============================================================
   2.5 归约器：事件流 → 页面 view-model

   合同：`../docs/EVENTS-graph.md`（wire）· 翻译规则：`docs/MAPPING-viz-wire-to-viewmodel-2026-07-28.md`。
   三者冲突时 docs/EVENTS-graph.md 定 wire，映射表定翻译，**页面的内部词表可以改、wire 不能**。

   这一段是**纯函数 + 一个累加器**，不碰 DOM、不发请求 —— 于是它能被零消耗回归直接喂事件、
   直接断言产出的 view-model（`test-viz.mjs`）。DOM 那一半在 §9。
   ============================================================ */

/* 「拿不到」的 code 里，有一个是我们自己造的：记录说资产在、却没给可打开的位置。
   ⚠️ 这种**不是** present —— 页面知道"东西在"却点不开，等于没有（docs/EVENTS-graph.md §3.1）。 */
const REC_BROKEN_CODE = 'record-broken';

/** wire 的 `AssetState` → 页面的 `a.s`。
 *  `naWhy` 是**这一处**的不适用理由 —— wire 只说"不适用"，为什么不适用是上下文知道的事。 */
function mapAsset(a, naWhy){
  if (a == null || typeof a !== 'object') return {s:'unlogged'};
  switch (a.state){
    case 'present':
      /* ⚠️ `present` 的 `ref`/`sha256`/`byteCount` **三样恒有，一个都不能少**（docs/EVENTS-graph.md §3.1）。
            缺 ref → 页面知道"东西在"却点不开，等于没有；
            缺 sha256 / byteCount → **"页面上这份 = 磁盘上那份"的唯一对证手段没了** ——
            照样渲染成可打开的 have，就是在把一份无法验证的字节当成权威记录展示。
            ⚠️ `byteCount` **可以是 0**（空产出是合法的 present），所以判据是"是不是非负整数"，
            **不是**真值判断 —— 写成 `!a.byteCount` 会把每一份空产出判成损坏。 */
      if (typeof a.ref !== 'string' || !a.ref) return {s:'unavailable', code:REC_BROKEN_CODE};
      if (!/^[0-9a-f]{64}$/.test(String(a.sha256))) return {s:'unavailable', code:REC_BROKEN_CODE};
      if (!Number.isSafeInteger(a.byteCount) || a.byteCount < 0) return {s:'unavailable', code:REC_BROKEN_CODE};
      return {s:'have', ref:a.ref, sha256:a.sha256, byteCount:a.byteCount};
    case 'not-applicable':
      return naWhy ? {s:'na', why:naWhy} : {s:'na'};
    case 'unavailable':
      /* code 是**开放字符串**：原样带走，不归到已知原因上、不改写成 unknown。 */
      return {s:'unavailable', code: typeof a.code === 'string' && a.code ? a.code : 'unknown'};
    default:
      return {s:'unlogged'};
  }
}

/** 一份现场（挂在**轮**上）→ 页面的三个独立资产 + 「本次未捕获现场」旗标。 */
function mapScene(sc){
  if (sc == null || typeof sc !== 'object'){
    const u = () => ({s:'unlogged'});
    return {scene:{session:u(), answer:u(), snapshot:u()}, sceneNone:false};
  }
  if (sc.state === 'present'){
    const f = sc.files || {};
    return {sceneNone:false, scene:{
      /* ⚠️ **键是逻辑名,不是磁盘上的文件名**(docs/EVENTS-graph.md §3.2)——合同刻意让两者不同。
            读成 f['session.log'] 会**三样全部落空**,于是每一份真实存在的现场都被显示成
            「没有这一项的记录」。而它长得像一次正常的缺席,没人会去查。 */
      session: mapAsset(f.sessionLog), answer: mapAsset(f.answer), snapshot: mapAsset(f.status),
    }};
  }
  if (sc.state === 'not-applicable'){
    const why = '正常收场，没有需要抢救的现场。';
    return {sceneNone:false, scene:{session:{s:'na',why}, answer:{s:'na',why}, snapshot:{s:'na',why}}};
  }
  /* 容器整个拿不到 = 「本次未捕获现场」。⚠️ 这与 not-applicable 是两件事：
     一个是"本来就不该有"，一个是"本该抢救、没来得及"。 */
  const code = typeof sc.code === 'string' && sc.code ? sc.code : 'unknown';
  return {sceneNone:true, scene:{session:{s:'unavailable',code}, answer:{s:'unavailable',code}, snapshot:{s:'unavailable',code}}};
}

/**
 * 可降级字段（`error` / `errorSummary` / `rejectedReason` / `reason`）→ 页面的有界摘要块。
 *
 * ⚠️ **这四个字段在 wire 上有两种形状**：≤2 KiB 时是**原样字符串**，超过才是 `BoundedSummary`
 * （docs/EVENTS-graph.md §3.3 第 4 条那道地板）。绝大多数错误走的是前一种。
 * 把字符串当对象读会得到一个 head/tail 全空、"省略了 0 字节"的摘要块 —— 那是**把正文弄丢**。
 */
function mapBounded(b){
  if (b == null || typeof b === 'string') return null;   // 没被降级过，就没有"省略"可言
  if (typeof b !== 'object') return null;
  return {head:b.head||'', tail:b.tail||'', omitted:b.omittedBytes||0, total:b.totalBytes||0,
          digest: b.sha256 ? 'sha256:'+b.sha256 : ''};
}
/** 同一个字段 → 一行纯文本（给标题/正文/诊断行用）。两种形状都吃。 */
function bText(b){
  if (b == null) return '';
  if (typeof b === 'string') return b;
  if (typeof b !== 'object') return String(b);
  return (b.head||'') + (b.omittedBytes ? '\n……（中间省略 '+b.omittedBytes+' 字节）……\n' : '') + (b.tail||'');
}

/* ---------------------------------------------------------- */

function newLiveState(){
  return {
    graphId: null,
    run: {started:false, outDir:null, maxConcurrent:null, startedTs:null, lastTs:null, final:null},
    nodes: new Map(),     // nodeSeq → 节点累加器
    /* 见过的 nodeSeq。⚠️ 这里**不是**"事件到达顺序"——
       `nodeSeq` 在 `prepareRun` 里分配、`node:observed` 之后才写，并发扇出下
       后拿号的那个完全可能先写出事件。真跑里就见过 #1 的 observed 排在 #0 前面。
       所以排序一律按 `nodeSeq`（那才是"谁先进来"的权威），排出来才稳定。 */
    order: [],
    /* 控制槽。⚠️ 这四样**不来自 transcript**，来自服务端的控制帧；
       它们是「运行状态四档判定」(§10.1) 里除 run:final 之外的全部依据。 */
    /* ⚠️ `ownerFinal` 与 `ownerLost` **是两个事实,不是一个布尔的两种来源**(§10.1 第 2/3 档)。 */
    ctl: {recordingFailed:null, historyReadFailure:null, ownerFinal:null, ownerLost:false, overflow:null},
    replay: {mode:'connecting', done:0},
    /* transcript 里读到的坏行数。⚠️ 只统计、不据此推断任何节点的状态。 */
    badLines: 0,
  };
}

function nodeOf(R, seq){
  let n = R.nodes.get(seq);
  if (!n){
    n = {seq, id:'#'+seq, agent:null, access:null, cwd:null, model:null, effort:null,
         specA:null, promptA:null, roleA:null, declaredDeps:[], inferredDeps:[], inferredDepsTruncated:false,
         group:null, observedTs:null, rejected:null, settled:null,
         turns:new Map(), turnOrder:[], turnCalls:0,
         firstStartedTs:null, endTs:null,
         ws:{intent:null, created:null},
         live:null, lastKind:null, lastTs:null};
    R.nodes.set(seq, n);
    /* 按 seq 有序插入。**不是**追加 —— 见 order 那条注释:到达顺序不等于 nodeSeq 顺序。 */
    let i = R.order.length;
    while (i > 0 && R.order[i-1] > seq) i--;
    R.order.splice(i, 0, seq);
  }
  return n;
}

function turnOf(n, key){
  let t = n.turns.get(key);
  if (!t){
    t = {key, announcedTs:null, input:null, timeoutMs:null, reask:0,
         started:false, startedTs:null, queuedMs:null,
         attempts:new Map(), attOrder:[], settled:null, lastTs:null};
    n.turns.set(key, t); n.turnOrder.push(key);
  }
  return t;
}
/** 把一处推断出来的依赖并进节点。**按首次出现顺序去重**，截断标志用 OR。 */
function mergeDeps(n, deps, truncated){
  if (Array.isArray(deps)) for (const d of deps) if (!n.inferredDeps.includes(d)) n.inferredDeps.push(d);
  if (truncated) n.inferredDepsTruncated = true;
}

/** 当前这一轮 = 最后一条被宣告的轮。节点级的「排队 / 运行」看它。 */
const lastTurn = n => n.turnOrder.length ? n.turns.get(n.turnOrder[n.turnOrder.length-1]) : null;

/**
 * 吃掉一条 transcript 事件。**只累加事实，不下任何结论** ——
 * 所有判定都留到 `buildScene`，那样"判定规则"只有一处、可以逐条对着映射表读。
 */
function applyEvent(R, ev){
  if (!ev || typeof ev !== 'object' || typeof ev.event !== 'string'){ R.badLines++; return; }
  const p = ev.payload || {};
  const ts = typeof ev.ts === 'number' ? ev.ts : null;
  if (ts != null) R.run.lastTs = R.run.lastTs == null ? ts : Math.max(R.run.lastTs, ts);
  if (ev.graphId && !R.graphId) R.graphId = ev.graphId;

  const touch = (n, kind) => { n.lastKind = kind; if (ts != null) n.lastTs = ts; };

  switch (ev.event){
    case 'run:started':
      R.run.started = true; R.run.outDir = p.outDir; R.run.maxConcurrent = p.maxConcurrent;
      R.run.startedTs = ts;
      break;

    case 'node:observed': {
      const n = nodeOf(R, p.nodeSeq);
      n.id = p.id; n.agent = p.agent; n.access = p.access; n.cwd = p.cwd;
      n.model = p.model; n.effort = p.effort;
      n.specA = p.spec; n.promptA = p.prompt; n.roleA = p.role;
      /* §3.1 / §5.2:**对话节点没有节点级 prompt**。这是判"是不是一段对话"的**唯一**判据,
         合同点名不许为此新加字段。 */
      n.isConversation = !!(p.prompt && p.prompt.state === 'not-applicable');
      n.declaredDeps = p.declaredDeps || []; n.inferredDeps = p.inferredDeps || [];
      n.inferredDepsTruncated = !!p.inferredDepsTruncated;
      n.group = 'group' in p ? p.group : null;
      n.observedTs = ts; touch(n, 'observed');
      break;
    }

    case 'node:rejected': {
      const n = nodeOf(R, p.nodeSeq);
      /* ⚠️ phase 与 error 是**两个独立的事实**，渲染时不许互相推断（映射表 §4.1）。 */
      n.rejected = {phase:p.phase, error:p.error, ts};
      touch(n, 'rejected');
      break;
    }

    case 'node:turn': {
      const n = nodeOf(R, p.nodeSeq);
      const t = turnOf(n, p.turnKey);
      t.announcedTs = ts; t.input = p.input; t.timeoutMs = p.timeoutMs; t.reask = p.reask;
      n.turnCalls++;
      /* ⚠️ **取并集,不是覆盖。** 第 1 轮推断出 A、第 2 轮推断出 B,覆盖的话页面上只剩 B ——
            而两条边都是真的(那两轮各自读了不同的产出)。截断标志同理用 OR:
            任何一处截断过,页面就该说"还有更多没显示"。 */
      mergeDeps(n, p.inferredDeps, p.inferredDepsTruncated);
      t.lastTs = ts; touch(n, 'turn');
      break;
    }

    case 'node:started': {
      const n = nodeOf(R, p.nodeSeq);
      const t = turnOf(n, p.turnKey);
      t.started = true; t.startedTs = ts; t.queuedMs = p.queuedMs;
      /* ⚠️ 「节点第一次开跑」取**第一条** node:started —— 那一轮**可能是后来没能开始的轮**，
            它照样起过钟、烧过墙上时间（映射表 §1.2）。 */
      if (n.firstStartedTs == null) n.firstStartedTs = ts;
      t.lastTs = ts; touch(n, 'started');
      break;
    }

    case 'node:workspace-intent': {
      const n = nodeOf(R, p.nodeSeq);
      n.ws.intent = {path:p.path, branch:p.branch, baseCommit:p.baseCommit};
      touch(n, 'workspace-intent');
      break;
    }
    case 'node:workspace-created': {
      const n = nodeOf(R, p.nodeSeq);
      n.ws.created = {path:p.path, branch:p.branch, baseCommit:p.baseCommit};
      touch(n, 'workspace-created');
      break;
    }

    case 'node:attempt': {
      const n = nodeOf(R, p.nodeSeq), t = turnOf(n, p.turnKey);
      let a = t.attempts.get(p.n);
      if (!a){ a = {n:p.n, settled:null}; t.attempts.set(p.n, a); t.attOrder.push(p.n); }
      a.input = p.input; a.inputSha256 = p.inputSha256; a.ts = ts;
      t.lastTs = ts; touch(n, 'attempt');
      break;
    }

    case 'node:attempt-settled': {
      const n = nodeOf(R, p.nodeSeq), t = turnOf(n, p.turnKey);
      let a = t.attempts.get(p.n);
      if (!a){ a = {n:p.n}; t.attempts.set(p.n, a); t.attOrder.push(p.n); }
      a.settled = {status:p.status, output:p.output, durationMs:p.durationMs,
                   charCount:p.charCount, rejectedReason:p.rejectedReason || null};
      t.lastTs = ts; touch(n, 'attempt-settled');
      break;
    }

    case 'node:progress': {
      const n = nodeOf(R, p.nodeSeq);
      /* 唯一可以整条丢的事件 —— 所以它**只喂实时窗口**，任何判定都不许依赖它。 */
      n.live = {turnKey:p.turnKey, status:p.status, charCount:p.charCount, tail:p.tail,
                contextUsage:p.contextUsage || null, lastEvent:p.lastEvent || null};
      touch(n, 'progress');
      break;
    }

    case 'node:turn-settled': {
      const n = nodeOf(R, p.nodeSeq), t = turnOf(n, p.turnKey);
      t.settled = {status:p.status, sessionReusable:p.sessionReusable, output:p.output,
                   scene:p.scene, charCount:p.charCount, durationMs:p.durationMs,
                   errorSummary:p.errorSummary || null, ts};
      t.lastTs = ts; touch(n, 'turn-settled');
      break;
    }

    case 'node:settled': {
      const n = nodeOf(R, p.nodeSeq);
      n.settled = {status:p.status, execution:p.execution, durationMs:p.durationMs,
                   receipt:p.receipt, artifact:p.artifact, diff:p.diff, turns:p.turns || [],
                   outcome: 'outcome' in p ? p.outcome : undefined,
                   workspaceSummary: p.workspaceSummary || null,
                   errorSummary: p.errorSummary || null};
      /* ⚠️ 复用命中时**这是唯一一份**推断依赖:那条路一条 turn 事件都不发,
            而 node:observed.inferredDeps 对对话节点恒为 []（那一刻一个字的正文都还没有）。
            少了这一步,一命中复用整段对话的推断边就全没了。 */
      for (const t of (p.turns || [])) mergeDeps(n, t.inferredDeps, t.inferredDepsTruncated);
      n.endTs = ts; touch(n, 'settled');
      break;
    }

    case 'run:final':
      R.run.final = {result:p.result, counts:p.counts, durationMs:p.durationMs, ts};
      break;

    default:
      /* 没见过的事件类型：**记下来，不崩、不猜**。工具比页面新是正常的。 */
      R.badLines++;
  }
}

/** 服务端控制帧。⚠️ 会被重复下发（每次 broadcastControl 都全量重发），必须幂等。 */
function applyControl(R, c){
  if (!c || typeof c !== 'object') return;
  switch (c.kind){
    case 'recording-failed':
      if (!R.ctl.recordingFailed) R.ctl.recordingFailed = {atSeq:c.atSeq, lastGoodOffset:c.lastGoodOffset, error:c.error};
      break;
    case 'history-read-failure':
      /* ⚠️ 与 recording-failed **不是一回事**：那是我们写不下去，这是我们读不回来。
            后者绝不能显示成「运行被掐断」——出问题的是读历史这一侧。 */
      if (!R.ctl.historyReadFailure) R.ctl.historyReadFailure = {reason:c.reason};
      break;
    case 'owner-final':
      /* **受控结束** —— owner 亲口说了它收场了(以及成没成)。 */
      if (!R.ctl.ownerFinal) R.ctl.ownerFinal = {result:c.result, endedAt:c.endedAt};
      break;
    case 'owner-lost':
      /* **管道 EOF、owner 一句话没留下。** ⚠️ 与上面那条**必须分开存** ——
         归并成一个"结束了"的布尔,第 2、3 档就共用同一句文案了,而 docs/EVENTS-graph.md §10.1 明令禁止:
         「受控结束但记录损坏」与「记录损坏且 owner 也丢了」是两种处置完全不同的事。 */
      R.ctl.ownerLost = true;
      break;
  }
}

/* ---------------------------------------------------------- */

/** §10.1 四档判定，**按顺序取第一个匹配**，reducer 不许换序。 */
function runStateOf(R){
  // 1. transcript 里有 run:final ⇒ 按 transcript 说的算
  if (R.run.final) return R.run.final.result === 'completed' ? 'ended' : 'ended_failed';
  if (R.ctl.recordingFailed){
    // 2. recording-failed + **owner-final** ⇒ 受控结束,但观测记录损坏
    if (R.ctl.ownerFinal) return 'log_broken_ended';
    // 3. recording-failed + EOF、**没有** owner-final ⇒ 观测损坏,且 owner 也丢了
    if (R.ctl.ownerLost) return 'log_broken_unknown';
    /* ⚠️ 记录坏了但 owner 还没结束:**两档都不是**。此时说"且不知道后来怎么样了"是提前下结论 ——
          owner 很可能还好好地在跑,只是我们记不下来了。落回"运行中"+ 损坏横幅。 */
    return 'running';
  }
  // 4. 以上都没有、EOF 前也没 final
  if (R.ctl.ownerFinal || R.ctl.ownerLost) return 'no_finish';
  return R.run.started ? 'running' : 'waiting';
}

/** 一次尝试的判词。wire 只有四档，其余是**观测者**对"没看到结局"的如实描述。 */
function attemptVerdict(a, nodeStatus){
  if (a.settled) return a.settled.status;         // accepted / rejected / no-output / failed
  if (nodeStatus === 'abandoned') return 'abandoned';
  if (nodeStatus === 'unlogged') return 'unlogged';
  if (nodeStatus === 'rejected') return 'rejected_local';
  if (nodeStatus === 'running' || nodeStatus === 'queued' || nodeStatus === 'discovered') return 'running';
  return 'unknown';                                // 节点有终态、这次尝试却没有结局
}

/** 还没产生的资产：节点仍在跑 → 「等待中」；否则我们**永远看不到它了**。 */
function pendingOr(nodeStatus, whenGone){
  if (nodeStatus === 'running' || nodeStatus === 'queued' || nodeStatus === 'discovered') return {s:'pending'};
  if (nodeStatus === 'unlogged') return {s:'unlogged'};
  return whenGone;
}

/** 从来没见过这一项的产生事件 —— **既不是"不适用",也不是"记录时它在、现在没了"。**
 *  ⚠️ 早先这里给的是 `gone`,那是在**声称**"它曾经在过";给 `na` 更糟,那是在声称"本来就不该有"。
 *  两句都是我们不知道的事。 */
const NEVER_SEEN = () => ({s:'unlogged'});

/** 节点状态。判定顺序即优先级，**不许换序**（映射表 §2 / §3.1）。 */
function nodeStatusOf(R, n){
  if (n.rejected) return 'rejected';
  if (n.settled) return n.settled.status;
  /* ⚠️ 全局记录损坏**盖过**逐节点推断：这些节点很可能好好跑完了，只是没人记下来。
        把一次记录故障摊派成一堆节点事故，是这个页面能犯的最有误导性的错误之一。 */
  if (R.ctl.recordingFailed) return 'unlogged';
  /* ⚠️ **历史没读全时,禁止据"缺了哪些事件"推断任何节点的状态**(docs/EVENTS-graph.md §10.1 末条)。
        出问题的是我们读历史这一侧 —— 那个节点很可能早就收场了,只是那几行没读回来。
        这里如实说"状态未知",而不是继续走 discovered/queued/running/abandoned。 */
  if (R.ctl.historyReadFailure) return 'unlogged';
  if (R.ctl.ownerFinal || R.ctl.ownerLost) return 'abandoned';
  const t = lastTurn(n);
  if (!t) return 'discovered';
  /* 轮已宣告但没拿到名额 = 排队中：**一个字都还没发给 AI**。 */
  if (!t.started) return 'queued';
  return 'running';
}

/** `abandoned` 的落点（§10.3 六档）。⚠️ 第 4/5 格文案相反，**不能合并**。 */
function abandonedAtOf(n){
  const t = lastTurn(n);
  if (!t) return {stage:'discovered'};
  if (!t.started) return {stage:'queued'};
  if (n.access !== 'write') return {stage:'running'};
  /* 第 4~6 格**只看那三条 workspace 事件的有无，与停在第几轮无关** ——
     工作副本是节点级的，N 轮共享一棵树。 */
  if (n.ws.created) return {stage:'running', writePhase:'created'};
  if (n.ws.intent)  return {stage:'running', writePhase:'creating'};
  return {stage:'running', writePhase:'pre'};
}

/** 把一轮投影成页面认的形状。 */
function projectTurn(R, n, t, nodeStatus){
  const st = t.settled;
  const turnStatus = st ? st.status : (t.started ? 'running' : 'queued');
  const sc = st ? mapScene(st.scene)
                : {sceneNone:false, scene:{session:pendingOr(nodeStatus, NEVER_SEEN()),
                                           answer: pendingOr(nodeStatus, NEVER_SEEN()),
                                           snapshot:pendingOr(nodeStatus, NEVER_SEEN())}};

  const attempts = t.attOrder.slice().sort((a,b)=>a-b).map(k => {
    const a = t.attempts.get(k);
    const v = attemptVerdict(a, nodeStatus);
    /* ⚠️ 没见过 attempt-settled 就**不知道**产出是什么状态 —— 不许说成「本来就不该有」。 */
    const out = a.settled ? mapAsset(a.settled.output) : pendingOr(nodeStatus, NEVER_SEEN());
    const o = {n:a.n, verdict:v,
               input: a.input ? mapAsset(a.input) : pendingOr(nodeStatus, NEVER_SEEN()),
               output: out};
    /* 同 errorOf：短的是原样字符串（要当正文显示），长的才有摘要块。两个槽分开给。 */
    if (a.settled && a.settled.rejectedReason != null){
      o.reject = mapBounded(a.settled.rejectedReason);
      o.rejectText = bText(a.settled.rejectedReason);
    }
    return o;
  });

  const o = {key:t.key, status:turnStatus, scene:sc.scene, sceneNone:sc.sceneNone, attempts,
             reusable: st ? st.sessionReusable === true : null};
  /* 「没能开始的轮」的原文照抄，不自己起标题 —— 它的结论一点都不含糊：**它没开始**。 */
  if (st && st.status === 'not-started' && st.errorSummary != null) o.error = bText(st.errorSummary);
  return o;
}

/**
 * 把 `node:settled.turns[]` 里的一项(TurnSummary)投影成页面认的轮。
 *
 * ⚠️ **复用命中的节点一条 turn 事件都不发**(docs/EVENTS-graph.md §5.9),它那 N 轮的**全部信息
 * 只存在于这里**。只按实时 turn 事件建轮的话,一个复用节点会被补出
 * 「一条空的 main 轮 / queued / 没联系过 AI」—— 而回执上白纸黑字写着 ok、七千多字。
 * **页面直接和回执打架**,这是最难被发现的一类错:它看起来像一次正常的排队。
 *
 * ⚠️ TurnSummary **刻意没有 scene 与 errorSummary**(§5.8):这条路上它们必然为空
 * (本次跑完的轮早由 node:turn-settled 公布过;复用命中的轮全是 ok,ok 的轮既没现场也没错误)。
 * 所以这里**不编**一个"正常收场"出来 —— 复用说"没跑,自然没有现场",其余说"没有这一项的记录"。
 */
function turnFromSummary(t, reused){
  const attempts = (t.attempts || []).map(a => {
    const o = {n:a.n, verdict:a.status, input:mapAsset(a.input), output:mapAsset(a.output)};
    if (a.rejectedReason != null){ o.reject = mapBounded(a.rejectedReason); o.rejectText = bText(a.rejectedReason); }
    return o;
  });
  const why = reused ? '这一次是复用，没有真跑，也就没有现场' : null;
  const slot = () => why ? {s:'na', why} : {s:'unlogged'};
  return {key:t.key, status:t.status, attempts, sceneNone:false,
          reusable: t.sessionReusable === true,
          scene:{session:slot(), answer:slot(), snapshot:slot()}};
}

/**
 * 一个节点的轮列表。**实时事件优先，回执摘要兜底。**
 *
 * 实时事件更细(有尝试时间线、有现场、有在途正文),有就用;
 * 一条都没有而回执里有 `turns[]` —— 那就是复用命中(或事件丢了),用摘要。
 */
function turnsOf(R, n, status){
  const sum = n.settled && Array.isArray(n.settled.turns) ? n.settled.turns : [];
  const reused = !!(n.settled && n.settled.execution === 'reused');
  const live = new Set(n.turnOrder);

  /* ⚠️ **逐 key 合并,不是"有实时事件就整份丢掉摘要"。**
        丢掉的那种写法在"事件掉了一部分"时会静默少画轮:两轮的节点只收到第 1 轮的事件、
        而回执摘要里明明有两轮 —— 页面就只画一轮,而且**看起来完全正常**。
        合并之后:见过事件的轮用事件(更细,有尝试时间线、有现场、有在途正文),
        没见过的轮用摘要补上,并且**按回执里的顺序**排 —— 回执才是权威的轮序。 */
  /* ⚠️ **顺序以「事件里被宣告的先后」为准,不是回执里的排列。**
        `not-started` 的轮**不进 `turns[]`**(合同明说),所以一段
        「`draft` 没能开始 → 回调换个 key → `fix` 跑成了」的对话里,
        回执里只有 `fix`。按"回执优先"排,页面会把它显示成 `fix → draft` ——
        **时间倒流**,而每一轮自己看起来都正常。
        事件里见过的按事件顺序;只在回执里有的(复用命中,或事件丢了)按回执顺序追加 ——
        它们是在收尾那一刻才被知道的,放在已知顺序之后不会与任何**观测到的**先后矛盾。 */
  const out = [];
  for (const k of n.turnOrder) out.push(projectTurn(R, n, n.turns.get(k), status));
  for (const ts of sum) if (!live.has(ts.key)) out.push(turnFromSummary(ts, reused));
  return out;
}

/**
 * 从**轮**里找一条失败原因。
 *
 * 取"最后一条非 ok 且带了原因的轮" —— 不取第一条:一段对话里前面的轮失败过、后面换个 key
 * 跑成了是常态,拿第一条会把一个已经解决的问题当成这个节点的结局。
 * ⚠️ `not-started` 的轮**恒有** errorSummary(那是它为什么没能开始的唯一说明),
 *    但它**不进 turns[]**、也不影响节点结局 —— 所以只在没有别的原因时才轮到它。
 */
function turnErrorOf(n, nodeStatus){
  let same = null, any = null, notStarted = null;
  for (const k of n.turnOrder){
    const t = n.turns.get(k); const st = t && t.settled;
    if (!st || st.errorSummary == null) continue;
    if (st.status === 'not-started'){ notStarted = {key:k, raw:st.errorSummary}; continue; }
    if (st.status === 'ok') continue;
    /* ⚠️ **优先挑与节点结局同一档的那一轮。**
          节点的 status 是「`turns[]` 里**最严重**的那一轮」(§5.8 第 2 级),而"最后一条失败的轮"
          未必是它。取错的后果不是少一句话,是**标题与正文互相打架**:
          第 1 轮 timeout、第 2 轮 contract_error ⇒ 节点是 timeout,标题写"超时被打断",
          正文却在讲格式不合格 —— 读的人会以为自己看错了,或者以为系统在胡说。 */
    if (st.status === nodeStatus) same = {key:k, raw:st.errorSummary};
    any = {key:k, raw:st.errorSummary};
  }
  /* 挑不到同档的(比如节点是 callback_error —— 那是**节点级**的结局,轮级压根没有这一档),
     退回"最后一条失败的轮",但它只是线索,不冒充判词。 */
  return same || any || notStarted;
}

/** 节点级的错误块。⚠️ `desc` 一律**照抄 wire 的 errorSummary**，标题才是页面自己的词。 */
function errorOf(n, status){
  const T = {contract_error:'输出格式不合格', backend_failed:'引擎明确报错',
             timeout:'超时被打断', unknown:'这个环节干没干完，说不清',
             callback_error:'各轮都跑完了，是编排那段 JS 自己抛了异常'};
  if (!T[status]) return null;
  /* ⚠️ **正文与摘要块是两件事**：可降级字段 ≤2 KiB 时是**原样字符串**（没有摘要块可画，
        但正文一个字都不能少），超限才是 BoundedSummary。绝大多数错误走的正是短的那条。 */
  /* ⚠️ 节点级 `errorSummary` **只在回执没归档成功时才出现**（§5.8）——
        也就是说,**绝大多数失败节点根本没有它**。只读这一处,一个 timeout 节点会显示成
        「这一档没有附带错误正文」,而原因正躺在旁边那一轮的 `node:turn-settled.errorSummary` 里
        （那一处只由"这轮不是 ok"决定,与回执无关）。**看得见的原因不给,是这个页面最没道理的一种沉默。** */
  const fromTurn = turnErrorOf(n, status);
  const rawErr = (n.settled && n.settled.errorSummary != null) ? n.settled.errorSummary : (fromTurn ? fromTurn.raw : null);
  const b = mapBounded(rawErr);
  const diag = [];
  if (n.settled){
    diag.push('node.status = '+status);
    diag.push('node.execution = '+n.settled.execution);
    if (n.settled.durationMs != null) diag.push('node.durationMs = '+n.settled.durationMs);
  }
  const text = bText(rawErr);
  const o = {title:T[status],
             desc: text || '这一档没有附带错误正文 —— 回执归档正常时，详细原因在回执里。',
             bounded:b, diagnostics:diag};
  /* 原因是从某一轮取来的就**说出来**:多轮节点里"哪一轮出的事"是另一个问题,
     不标出处会让人以为这是对整个节点的判词。 */
  if (!(n.settled && n.settled.errorSummary != null) && fromTurn) o.descFrom = fromTurn.key;
  return o;
}

/** write 节点的交付结论。⚠️ `outcome` **缺席**即 read 节点 —— 别用 access 字段猜。 */
function writeOf(n, status){
  const s = n.settled;
  if (s){
    if (!('outcome' in s) || s.outcome === undefined) return null;     // read 节点
    /* ⚠️ workspaceSummary **只在回执没归档成功时**才出现（docs/EVENTS-graph.md §5.8 的两级兜底）。
          回执在的时候这里是空对象 —— 分支、路径这些要去回执里读，不是"丢了"。
          ⚠️ 事件里**刻意没有** filesChanged（无上限）与 committed（交付结论只认 outcome）。
          所以这条路上给不出改动清单，页面必须说清"要看清单去回执"，不能默默显示成零项。 */
    const w = s.workspaceSummary || {};
    const hasWs = !!s.workspaceSummary;
    return {
      outcome: s.outcome, branch: w.branch || null, base: w.baseCommit || null,
      /* null = 「这一层拿不到清单」，与 []（确知零项）不是一回事。 */
      files: null,
      changesKnown: typeof w.changesKnown === 'boolean' ? w.changesKnown : null,
      /* 「分支往前走了，只是净改动为零」——真实存在的形状：一个**空提交**（HEAD 动了、
         净改动为零），所以它既不是 `no-changes`（那要求 HEAD 也没动），也不该被说成普通交付。

         ⚠️ **判据是 diff 自己是零字节，不是 `changesKnown`。**
            `changesKnown` 的意思是「git 探测**跑成了**」——生产者在拿到任何正常结果之后
            就置 true（node-core `out.changesKnown = true`），**包括改了一大堆文件的那些**。
            拿它当"确知没有改动"，等于把「测出来了」读成「测出来是零」：一个改了十个文件、
            正常交付的节点，会被页面斩钉截铁地写成"已交付，但这次提交没有净改动"。
            **一句凭空捏造的结论，而且它长得比真话还确定。**
         ⚠️ diff 拿不到时**不下这个结论**（宁可少说一句，也不说一句可能是假的）。 */
      netEmpty: s.outcome === 'delivered' && !!s.diff && s.diff.state === 'present' && s.diff.byteCount === 0,
      inlineFallback: hasWs,
      reason: s.outcome === 'unknown' ? '提交或收尾步骤没有跑完，改动有没有落到分支上说不清。' : undefined,
      /* ⚠️ **removed:false 的准确读法是「收尾时没有确认清理」**（docs/EVENTS-graph.md §5.8）：
            可能没删、也可能删了但没确认，**推不出「这个目录现在还在磁盘上」**。
            说"还在"会让人去核对一个可能不存在的目录；说"未确认"，人才知道去看一眼、
            也知道看不到并不代表出了错。 */
      worktree: {state: w.removed === true ? 'cleaned'
                      : w.removed === false ? 'unconfirmed'
                      : hasWs ? 'unlogged' : 'unlogged',
                 path: w.path || null},
      diff: mapAsset(s.diff, s.outcome === 'no-changes' ? '没有可交付的改动' : undefined),
    };
  }
  if (n.access !== 'write') return null;
  /* 没有回执的 write 节点：工作副本去向按**三条 workspace 事件的有无**如实说。 */
  const ws = n.ws.created ? {state:'unconfirmed', path:n.ws.created.path}
           : n.ws.intent  ? {state:'unconfirmed_create', path:n.ws.intent.path}
           : {state:'not_started', path:null};
  const src = n.ws.created || n.ws.intent || {};
  return {outcome:null, branch:src.branch || null, base:src.baseCommit || null, files:null,
          worktree:ws, diff:{s:'unlogged'}};
}

/**
 * 依赖 id → nodeSeq。**只有本 graph 内该 id 恰好出现一次时才连边。**
 *
 * ⚠️ id **可以重复**（唯一键是 nodeSeq）。重复时"挑一个最近的"是在**编造一条因果**：
 * 用户写的 `deps:["audit"]` 到底指哪一个 audit，事件流里没有这个信息，猜错了就是
 * 把一条不存在的依赖画成实线。**不唯一就不画**，改为在节点上如实说一句。
 * ⚠️ 同理，id 在本 graph 里**根本不存在**时也不画（那多半是拼错了）——但同样要说出来，
 * 静默丢掉会让"我明明写了依赖"变成一个查不到原因的谜。
 *
 * 返回 `{seq}` / `{ambiguous:n}` / `{missing:true}`。
 */
function resolveDep(R, id){
  const hits = [];
  for (const s of R.order){ const x = R.nodes.get(s); if (x && x.id === id) hits.push(s); }
  if (hits.length === 1) return {seq:hits[0]};
  if (hits.length === 0) return {missing:true};
  return {ambiguous:hits.length};
}

/** 事件流 → 一个 scene（与静态演示场景**同一个形状**，走同一个渲染器）。 */
function buildScene(R){
  const state = runStateOf(R);
  const t0 = R.run.startedTs;
  const sec = ts => (ts == null || t0 == null) ? null : (ts - t0)/1000;
  /* ⚠️ **运行中的「现在」取墙上时钟,不能取最后一条事件的时间戳。**
     桥内部按 5 分钟切片 wait,模型思考期间一条事件都不发 —— 取 lastTs 的话页面会顶着
     绿灯「实时」冻在原地:真跑一次实测到"页面显示已跑 8s、实际已跑 281 秒",
     第二次"显示 5m08s、实际 494s",差值精确等于"距最后一条事件的时间"。
     而观测台的全部用途就是判断"还在动还是卡住了" —— 冻住的那几分钟恰恰是最需要答案的时候,
     而且方向是反的:一个安静了五分钟的 run,看起来像刚起步。
     ⚠️ **只在真的连着一个活着的 run 时才这么算。** 打开一份静态归档时没有「现在」可言
        (那时 owner 已经丢了,state 不会是 running),只能按记录里的最后一刻算。 */
  const liveClock = state === 'running' && R.replay.mode === 'live' && !R.ctl.overflow;
  const nowMs = R.run.final ? (t0 != null ? t0 + R.run.final.durationMs : R.run.lastTs)
              : liveClock ? Math.max(Date.now(), R.run.lastTs ?? 0)
              : R.run.lastTs;
  const now = sec(nowMs) ?? 0;

  const nodes = R.order.map(seq => {
    const n = R.nodes.get(seq);
    const status = nodeStatusOf(R, n);
    const turns = turnsOf(R, n, status);
    /* ⚠️ 数据层**不给单轮节点留没有 turn 的旧路径**（docs/EVENTS-graph.md §10.9 第 7 条）；
          「一轮不显示外层控件」是渲染层的事。连一轮都没起过的节点给一条空轮。 */
    if (!turns.length){
      turns.push({key:'main', status: status==='rejected' ? 'not-started' : 'queued',
                  attempts:[], sceneNone:false,
                  scene:{session:pendingOr(status,{s:'na',why:'没有联系过 AI'}),
                         answer: pendingOr(status,{s:'na',why:'没有联系过 AI'}),
                         snapshot:pendingOr(status,{s:'na',why:'没有联系过 AI'})}});
    }

    const firstTurn = n.turnOrder.length ? n.turns.get(n.turnOrder[0]) : null;
    const qFrom = sec(firstTurn ? firstTurn.announcedTs : n.observedTs);
    const rFrom = sec(n.firstStartedTs);
    const rTo   = sec(n.endTs != null ? n.endTs : (n.rejected ? n.rejected.ts : null));
    const words = n.settled ? (n.settled.turns || []).reduce((s,x)=> s + (x.charCount||0), 0)
                            : (n.live && n.live.charCount) || 0;

    const o = {
      seq, id:n.id, engine:n.agent, mode:n.access, model:n.model, effort:n.effort, status,
      t:{q:[qFrom, rFrom != null ? rFrom : (rTo != null ? rTo : null)], r:[rFrom, rTo]},
      words, ctx: n.live && n.live.contextUsage ? n.live.contextUsage.tokens : null,
      turns,
    };
    if (n.settled && n.settled.execution === 'reused'){
      /* ⚠️ 复用时 durationMs 是**原来那次执行**的耗时，不是这次复用检查的耗时。 */
      o.reused = true; o.origRun = Math.round(n.settled.durationMs/1000);
    }
    if (n.rejected){
      o.rejected = {kind:n.rejected.phase, detail: bText(n.rejected.error)};
      if (n.rejected.phase === 'workspace-setup' && n.ws.intent) o.rejected.plannedPath = n.ws.intent.path;
    }
    if (status === 'abandoned') o.abandonedAt = abandonedAtOf(n);
    if (status === 'unlogged' && R.ctl.recordingFailed) o.unloggedFrom = R.ctl.recordingFailed.atSeq;
    /* ⚠️ 这五份是**这个环节留下来的全部可打开的东西**。早先一份都没进 view-model ——
          于是页面上跑完一个环节，却给不出"产出文件在哪""回执在哪"。
          产出（artifact）尤其要命：它就是跑这个环节的**全部目的**。 */
    const st = n.settled;
    o.files = {
      artifact: st ? mapAsset(st.artifact) : pendingOr(status, NEVER_SEEN()),
      receipt:  st ? mapAsset(st.receipt)  : pendingOr(status, NEVER_SEEN()),
      spec:     mapAsset(n.specA),
      prompt:   mapAsset(n.promptA),
      role:     mapAsset(n.roleA),
    };
    /* 会话毒化点 = `turns[]` 里**第一个** `sessionReusable === false` 的轮(§5.4)。
       ⚠️ **前面必须先过一道闸:这个节点得是一段对话** —— 判据是
          `node:observed.prompt.state === "not-applicable"`(§3.1、§5.2),不新加字段。
          不过闸的话,一个普通 `runNode` 报 `backend_failed` 时会被显示成"对话被封口",
          而它根本不是对话:那一轮失败了就是失败了,和"后面本来还想聊"没有关系。
       ⚠️ 闸只判"是不是对话",**不判聊了几轮**:只聊一轮就被毒化的对话,
          封口恰恰是"为什么只有一轮"的真正解释。 */
    if (n.isConversation){
      const p = o.turns.find(t => t.reusable === false);
      if (p) o.poisonedAt = p.key;
    }
    const err = errorOf(n, status); if (err) o.error = err;
    const w = writeOf(n, status); if (w) o.write = w;
    if (status === 'running'){
      const lt = lastTurn(n);
      /* 拿到名额、工作副本还没确认建成、也还没发出第一次尝试 —— 这一段**还没联系 AI**。 */
      if (n.access === 'write' && lt && lt.started && !n.ws.created && !lt.attempts.size) o.phase = 'preparing_worktree';
      o.live = {tail: n.live ? n.live.tail : '', words, event: n.live && n.live.lastEvent ? n.live.lastEvent.type : (n.lastKind||'')};
    }
    /* 派生量：只在这里算，**一条都不许补回 wire**（docs/EVENTS-graph.md §10.9 第 9 条）。 */
    const notStarted = n.turnOrder.filter(k => {
      const s = n.turns.get(k).settled; return s && s.status === 'not-started';
    });
    const notes = [];
    if (notStarted.length) notes.push('有 '+notStarted.length+' 轮没能开始（'+notStarted.join('、')+'）');
    if (n.inferredDepsTruncated) notes.push('推断出的依赖被截断，实际条数多于这里显示的');
    if (notes.length) o.note = notes.join(' · ');
    return o;
  });

  /* 拓扑：声明边实线、推断边虚线。⚠️ 「把推断当事实展示」是这个页面最容易造成的误导。 */
  const edges = [];
  const byId = new Map(nodes.map(x => [x.seq, x]));
  for (const seq of R.order){
    const n = R.nodes.get(seq);
    const bad = [];
    /* ⚠️ 连不上的依赖**必须说出来**：一条 id 打错的 deps 静默消失，用户看到的是
          「我明明写了依赖，图上却没有」，且没有任何线索可查。重复 id 同理 ——
          猜一个"最近的"等于凭空发明一条因果。 */
    const link = (id, kind, extra) => {
      const r = resolveDep(R, id);
      if (r.missing){ bad.push('<code>'+esc(id)+'</code>（本图里没有这个 id）'); return; }
      if (r.ambiguous){ bad.push('<code>'+esc(id)+'</code>（本图里有 '+r.ambiguous+' 个同名节点，指哪个无从判断）'); return; }
      if (edges.some(e => e.a===r.seq && e.b===seq)) return;  // 已经有一条了就不重画
      edges.push(Object.assign({a:r.seq, b:seq, kind}, extra));
    };
    for (const id of n.declaredDeps) link(id, 'declared');
    for (const id of n.inferredDeps) link(id, 'inferred', {
      why:'<code>'+esc(id)+'</code> 的产出文件出现在 <code>'+esc(n.id)+'</code> 的输入原文里。'+
          '<b>这是猜的</b> —— 系统按文件名做子串匹配，没有校验过因果。'});
    if (bad.length){
      const v = byId.get(seq);
      if (v) v.note = (v.note ? v.note + ' · ' : '') + '有依赖连不上图里的节点：' + bad.join('、');
    }
  }
  /* 声明的先后与实际执行不符时给一句提醒：那条边只是一句声明。 */
  for (const e of edges){
    if (e.kind !== 'declared') continue;
    const A = byId.get(e.a), B = byId.get(e.b);
    if (A && B && A.t.r[1] != null && B.t.r[1] != null && A.t.r[1] > B.t.r[1]){
      e.warn = '声明的先后与实际执行不符：<code>'+B.id+'</code> 比 <code>'+A.id+'</code> 更早结束。'+
               '这条边只是一句声明，系统既不校验也不据此调度。';
    }
  }

  const run = {
    id: R.graphId, dir: R.run.outDir, state, slots: R.run.maxConcurrent || 1,
    elapsed: R.run.final ? R.run.final.durationMs/1000 : now, now,
  };
  if (R.ctl.recordingFailed){
    run.brokenAt = R.ctl.recordingFailed.atSeq;
    run.brokenWhy = bText(R.ctl.recordingFailed.error) || '记录写入失败。';
  }
  if (R.ctl.historyReadFailure){
    /* ⚠️ 这一条**只**说明历史没读全，与运行本身无关 —— 页面必须分开说。 */
    run.replayIncomplete = true;
    run.replayFrom = R.replay.done;
  }
  if (R.replay.mode === 'replaying'){
    run.state = 'replaying'; run.replayDone = R.replay.done; run.replayTotal = R.replay.done;
  }

  const conn = R.ctl.overflow
    ? {s:'reconnect', text:'积压超限，已被服务端断开 · 正在重连'}
    : R.replay.mode === 'lost' ? {s:'reconnect', text:'连接已断开 · 正在重连'}
    : R.replay.mode === 'connecting' ? {s:'wait', text:'正在连接'}
    : {s:'live', text: state==='running' ? '实时' : '实时 · 运行已结束'};

  return {key:'live', label:'实时', run, conn, select:null, edges, nodes};
}

/* ============================================================
   3. 工具
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICO = {
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4.5 2.6 20h18.8L12 4.5Z"/><path d="M12 10v4"/><path d="M12 17.2v.2"/></svg>',
  cut:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12h4"/><path d="M16 12h4"/><path d="M10.5 12h.1M13.4 12h.1"/></svg>',
  plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v6"/><path d="M8 9h8v3a4 4 0 0 1-8 0V9Z"/><path d="M12 16v5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8v.2"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  caret:'<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  wait:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  ban:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6.2 6.2l11.6 11.6"/></svg>',
};

function fmtDur(sec){
  if (sec==null || !isFinite(sec)) return '—';
  if (sec < 1) return Math.round(sec*1000)+'ms';
  const s = Math.round(sec), h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60;
  if (h) return h+'h'+String(m).padStart(2,'0')+'m';
  if (m) return m+'m'+String(r).padStart(2,'0')+'s';
  return r+'s';
}
const fmtN = n => n==null ? '—' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const engColor = e => 'var('+(ENGINES[e]?ENGINES[e].v:'--faint')+')';
const engBadge = (e,sm) => '<span class="badge'+(sm?' sm':'')+'" style="--ec:'+engColor(e)+'" title="引擎 '+esc(e)+'">'+esc(ENGINES[e]?ENGINES[e].short:'??')+'</span><span class="sr-only">引擎 '+esc(e)+'</span>';

/* ---- 极简 Markdown 渲染:只渲染,绝不改写原文 ---- */
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function mdBlocks(src){
  const lines = String(src).split('\n');
  let out = '', list = null;
  const closeList = () => { if (list){ out += '</'+list+'>'; list = null; } };
  for (const raw of lines){
    const line = raw.replace(/\s+$/,'');
    let m;
    if (!line.trim()){ closeList(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))){ closeList(); out += '<h'+m[1].length+'>'+inlineMd(m[2])+'</h'+m[1].length+'>'; continue; }
    if (/^---+$/.test(line.trim())){ closeList(); out += '<hr/>'; continue; }
    if ((m = line.match(/^>\s?(.*)$/))){ closeList(); out += '<blockquote>'+inlineMd(m[1])+'</blockquote>'; continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))){ if (list!=='ul'){ closeList(); out += '<ul>'; list='ul'; } out += '<li>'+inlineMd(m[1])+'</li>'; continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)$/))){ if (list!=='ol'){ closeList(); out += '<ol>'; list='ol'; } out += '<li>'+inlineMd(m[1])+'</li>'; continue; }
    closeList(); out += '<p>'+inlineMd(line)+'</p>';
  }
  closeList();
  return out;
}
function md(src){
  const parts = String(src==null?'':src).split('```');
  let out = '';
  parts.forEach((chunk,i)=>{
    if (i % 2 === 1){
      const body = chunk.replace(/^[a-zA-Z0-9]*\n/,'').replace(/\n$/,'');
      const n = body.split('\n').length;
      out += '<details class="codefold"'+(n<=10?' open':'')+'><summary>'+ICO.caret+'展开代码块（约 '+n+' 行）</summary><pre>'+esc(body)+'</pre></details>';
    } else out += mdBlocks(chunk);
  });
  return out;
}

/* ---- 复制(零依赖,带降级) ---- */
function copyText(text, btn){
  const done = ok => { if (!btn) return;
    const old = btn.getAttribute('data-label') || btn.textContent;
    btn.classList.toggle('done', ok); btn.innerHTML = ICO.copy + (ok ? '已复制' : '复制失败');
    setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML = ICO.copy + old; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false)); return;
  }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
  document.body.removeChild(ta); done(ok);
}
const COPYBUF = [];
function copyBtn(label, text){
  const i = COPYBUF.push(text) - 1;
  return '<button type="button" class="copy" data-copy="'+i+'" data-label="'+esc(label)+'">'+ICO.copy+esc(label)+'</button>';
}

/* ---- §6.6 六态资产渲染器(全页通用) ---- */
function assetRow(name, a, openLabel){
  const b = [];
  if (!a) a = {s:'unlogged'};
  switch (a.s){
    case 'have':
      /* ⚠️ 只有拿得到 ref 才渲成链接。演示台的资产没有 ref,渲成不可点的标签 ——
            **给一个点了没反应的链接,比不给更糟**。 */
      b.push(a.ref
        ? '<a class="a-open" href="/file?ref='+encodeURIComponent(a.ref)+'" target="_blank" rel="noopener">'+
          esc(openLabel||('打开'+name))+'</a>'
        : '<span class="a-open">'+esc(openLabel||('打开'+name))+'</span>');
      if (a.byteCount != null) b.push('<div class="a-why">'+fmtN(a.byteCount)+' 字节</div>');
