      if (a.empty) b.push('<div class="a-why">这份 diff 是空文件——这次提交没有净改动。</div>');
      /* ⚠️ 归档区就在磁盘上，谁都能改。取回来的字节与事件里记的指纹对不上时**必须说** ——
            静默显示等于让人拿一份被改过的字节当证据。合同也明确要求不许因此判 4xx/5xx：
            文件确实在、也确实读到了，拒绝服务只会让人以为文件丢了（docs/EVENTS-graph.md §11）。 */
      if (a.verify === 'mismatch') b.push('<div class="a-why" data-warn="1"><b>这不是事件记录的那一份（文件已被改动）。</b>'+
        '记录里的指纹是 <code>'+esc(String(a.sha256||'').slice(0,16))+'…</code>，'+
        '刚取回来的是 <code>'+esc(String(a.gotSha||'').slice(0,16))+'…</code>。下面显示的是**磁盘上现在这一份**。</div>');
      else if (a.verify === 'no-header') b.push('<div class="a-why">服务端没给指纹响应头，这一份**没能与记录对证**。</div>');
      break;
    case 'na':
      b.push('<span class="a-flag" data-s="na">不适用</span>');
      b.push('<div class="a-why">'+esc(a.why||'本来就不该有这一项。')+'</div>');
      break;
    case 'unavailable': {
      const known = UNAVAIL[a.code];
      b.push('<span class="a-flag" data-s="unavailable">拿不到</span>');
      b.push('<div class="a-why">这一项现在打不开：'+
        (a.why ? esc(a.why) : known ? esc(known) : '原因码不在已知清单里，无法进一步解释——请拿这个原因码去查。')+
        ' <code>'+esc(a.code||'UNSPECIFIED')+'</code>'+
        (a.digest ? ' · 指纹 <code>'+esc(a.digest)+'</code>' : '')+'</div>');
      break;
    }
    case 'pending':
      b.push('<span class="a-flag" data-s="pending">等待中</span>');
      b.push('<div class="a-why">环节还在跑，这一项还没产生。</div>');
      break;
    case 'gone':
      b.push('<span class="a-flag" data-s="gone">记录时它在，现在取不到了</span>');
      b.push('<div class="a-why">记录的时候确实有这个文件，现在按记下来的位置取不回来——可能被后来的清理删掉了。这与「本来就没有」是两件事。</div>');
      break;
    default:
      b.push('<span class="a-flag" data-s="unlogged">状态未知</span>');
      b.push('<div class="a-why">记录从某处起不完整，这一项的状态未知——既不能说它不适用，也不能说它没记下来。</div>');
  }
  return '<div class="asset"><span class="a-n">'+esc(name)+'</span><span class="a-b">'+b.join('')+'</span></div>';
}

/* ---- §6.4 有界摘要:头 + 尾 + 省略量 + 总量 + 指纹,结尾必须显示 ---- */
function bounded(b, label){
  if (!b) return '';
  return '<div class="bounded">'+
    (label?'<div class="bd-lab">'+esc(label)+'</div>':'')+
    '<pre>'+esc(b.head)+'</pre>'+
    '<div class="bd-gap">'+ICO.warn.replace('<svg','<svg style="width:12px;height:12px;flex:0 0 auto"')+'中间省略了 '+fmtN(b.omitted)+' 字节</div>'+
    '<pre>'+esc(b.tail)+'</pre>'+
    '<div class="bd-foot"><span>总计 '+fmtN(b.total)+' 字节</span><span>指纹 '+esc(b.digest)+'</span></div>'+
  '</div>';
}

/* ============================================================
   4. 顶栏 / 横幅
   ============================================================ */
const RUNSTATE = {
  waiting:          {r:'waiting',           t:'等待运行开始'},
  replaying:        {r:'replaying',         t:'正在回放历史记录'},
  running:          {r:'running',           t:'运行中'},
  ended:            {r:'ended',             t:'已结束'},
  ended_failed:     {r:'ended_failed',      t:'已结束（失败）'},
  no_finish:        {r:'no_finish',         t:'未观测到正常收尾'},
  log_broken_ended: {r:'log_broken_ended',  t:'已结束，但观测记录从某处起损坏'},
  log_broken_unknown:{r:'log_broken_unknown',t:'观测记录损坏，且不知道后来怎么样了'},
};

function countsOf(nodes){
  const c = {total:nodes.length, running:0, queued:0, ok:0, fail:0, rejected:0, unknown:0, abandoned:0, unlogged:0};
  for (const n of nodes){
    if (n.status==='running') c.running++;
    else if (n.status==='queued'||n.status==='discovered') c.queued++;
    else if (n.status==='ok') c.ok++;
    else if (n.status==='rejected') c.rejected++;
    else if (n.status==='unknown') c.unknown++;
    else if (n.status==='abandoned') c.abandoned++;
    else if (n.status==='unlogged') c.unlogged++;
    else c.fail++;
  }
  return c;
}

function renderTop(sc){
  const rs = RUNSTATE[sc.run.state] || RUNSTATE.waiting;
  $('#runId').textContent = sc.run.id ? sc.run.id + ' · ' + sc.run.dir : '尚未收到任何运行';
  $('#runPill').setAttribute('data-r', rs.r);
  $('#runPillText').textContent = rs.t + (sc.run.state==='running' && sc.run.elapsed!=null ? ' · 已跑 '+fmtDur(sc.run.elapsed) : '')
    + (sc.run.state==='ended' && sc.run.elapsed!=null ? ' · 用时 '+fmtDur(sc.run.elapsed) : '');

  const c = countsOf(sc.nodes), box = $('#counts');
  if (sc.run.state === 'replaying'){
    /* 回放没读完就给一个看起来完整的汇总,和「记录损坏」那一档犯的是同一个错 */
    box.innerHTML = '<span class="counts-note" style="border-style:solid;border-color:color-mix(in oklab,var(--accent) 38%,var(--line));'+
      'background:color-mix(in oklab,var(--accent) 7%,var(--surface));color:var(--accent)">回放中 · 已读 '+
      fmtN(sc.run.replayDone)+' / '+fmtN(sc.run.replayTotal)+' 条，计数尚未就绪</span>';
    return;
  }
  if (sc.run.state === 'log_broken_unknown'){
    box.innerHTML = '<span class="counts-note">汇总计数不可用 —— 记录断在第 '+fmtN(sc.run.brokenAt)+' 条，无法给出可信的总数</span>';
    return;
  }
  const rows = [
    ['total','环节',c.total],['running','运行中',c.running],['queued','排队/准备',c.queued],
    ['ok','完成',c.ok],['fail','失败',c.fail],['rejected','被拒绝',c.rejected],
    ['unknown','说不清',c.unknown],['abandoned','未见结局',c.abandoned],['unlogged','状态未记录',c.unlogged],
  ].filter(r => r[0]==='total' || r[2] > 0);
  box.innerHTML = (sc.run.state==='log_broken_ended'
      ? '<span class="counts-note">以下为截至第 '+fmtN(sc.run.brokenAt)+' 条记录的部分计数</span>' : '')
    + rows.map(r => '<span class="count" data-k="'+r[0]+'">'+esc(r[1])+' <b>'+r[2]+'</b></span>').join('');
}

function banner(v, ic, title, desc){
  return '<div class="banner" data-v="'+v+'"><span class="b-ic">'+ic+'</span><div><div class="b-t">'+title+'</div><div class="b-d">'+desc+'</div></div></div>';
}
function renderBanners(sc){
  const out = [];
  if (sc.run.state === 'replaying'){
    out.push(banner('info', ICO.wait, '正在回放历史记录 · 已读 '+fmtN(sc.run.replayDone)+' / '+fmtN(sc.run.replayTotal)+' 条',
      '刚连上，正在从记录文件<b>完整回放</b>这次运行到此刻为止的全部事件 —— <b>不会丢事件</b>，你也不需要做任何事。'+
      '读完之前下面是占位骨架，环节卡与汇总计数会在读完后一次就位。'));
  }
  if (sc.conn.s === 'reconnect'){
    out.push(banner('conn', ICO.plug, '连接已断开 · 正在重连',
      '页面已经停止接收新事件，下面看到的是断开前的最后一帧，<b>不是当前状态</b>。'+
      '两种可能：服务已经停了；或者这个页面消费得太慢、积压超过上限，服务端主动把它断开让它重连。'+
      '<b>后者不是故障</b> —— 重连后会从记录文件完整回放，不会丢事件。'));
  }
  if (sc.run.replayIncomplete){
    out.push(banner('unlog', ICO.warn, '历史回放不完整 —— 出问题的是我们读历史这一侧',
      '重连后回放记录文件时读到了坏行，第 '+fmtN(sc.run.replayFrom)+' 条之后没能读回来。'+
      '<b>这不是「未观测到正常收尾」</b>：任务很可能好好地在跑，只是这个页面没把历史读全。没回放到的部分<b>不等于本来就没有</b>。'));
  }
  if (sc.run.state === 'no_finish'){
    out.push(banner('lost', ICO.cut, '未观测到正常收尾',
      '我们没有看到这次运行正常收尾。<b>最常见的成因是进程被强行终止</b>（Ctrl-C / 被杀），来不及写下"我结束了"；'+
      '但报信的两条通道同时坏掉时，它其实也可能有序地收了场。<b>成因只是推测，定义只有一句：我们没看到它收尾。</b><br>'+
      '还停在「已发现 / 排队中 / 运行中」的环节已统一标成 <code>abandoned</code> —— 意思是<b>没看到它的结局</b>，'+
      '不是"结果永远拿不到了"：工作副本、分支、锁文件往往都还在。'));
  }
  if (sc.run.state === 'log_broken_ended'){
    out.push(banner('unlog', ICO.warn, '已结束，但观测记录从第 '+fmtN(sc.run.brokenAt)+' 条起损坏',
      esc(sc.run.brokenWhy)+'<br><b>此后记录不完整。</b>下面标成「状态未记录」的环节<b>很可能好好地跑完了，只是没人记下来</b> —— '+
      '它们<b>不是</b> <code>abandoned</code>，别逐个去排查。'));
  }
  if (sc.run.state === 'log_broken_unknown'){
    out.push(banner('unlog', ICO.warn, '观测记录从第 '+fmtN(sc.run.brokenAt)+' 条起损坏，且不知道后来怎么样了',
      esc(sc.run.brokenWhy)+'<br>与「未观测到正常收尾」<b>不是一回事</b>：那一档说的是任务，这一档说的是记录。'+
      '汇总计数已标为不可用 —— 记录都断了，给一个看起来完整的汇总是错的。'));
  }
  if (sc.nodes.length && !sc.edges.length){
    out.push(banner('info', ICO.info, '这次运行没有任何依赖信息',
      '用户没有声明依赖，系统也没有推断出任何一条。图视图会退化成一堆孤立方块，因此<b>自动落到时间轴</b>。'+
      '时间轴上的先后<b>不代表因果</b> —— 名额只有 '+sc.run.slots+' 个，B 排在 A 之后很可能只是在等名额。'));
  }
  $('#banners').innerHTML = out.join('');
}

/* ============================================================
   5. B 主视图 · 图视图
   50 节点的应对:分层布局 + 排队区折叠成一行摘要 + 缩放/适应画布
   ============================================================ */
const COLW = 216, GAPX = 78, GAPY = 14, PAD = 22;
/* 预留高度必须与实际渲染出来的行数一致 —— 对不上就会把文字挤出卡片外框。
   两个 phase 都会渲染尾巴行,所以都要按带尾巴的高度预留。 */
const hasTail = n => n.status==='running' && (n.phase==='streaming' || n.phase==='preparing_worktree');
const nodeH = n => hasTail(n) ? 112 : 72;

function statusChip(n){
  const st = STATUS[n.status] || {short:n.status};
  const dot = n.status==='running' ? '<span class="dt"></span>' : '';
  return '<span class="nb-st st-'+n.status+'">'+dot+esc(st.short)+'</span>';
}

function nodeHTML(n, selected){
  const st = STATUS[n.status] || {};
  let t = '';
  if (n.status==='queued') t = '排队 '+fmtDur(cur(n.t.q[0], SC.run.now) );
  else if (n.status==='discovered') t = '准备中';
  else if (n.status==='running') t = '已跑 '+fmtDur(SC.run.now - n.t.r[0]);
  else if (n.status==='unlogged') t = '无结束记录';
  else if (n.reused) t = '复用 '+fmtDur(n.t.r[1]-n.t.r[0]);
  else if (n.t.r[0]!=null && n.t.r[1]!=null) t = fmtDur(n.t.r[1]-n.t.r[0]);
  return '<button type="button" class="nodebox" data-seq="'+n.seq+'" data-st="'+n.status+'" aria-pressed="'+(selected?'true':'false')+'"'+
    ' style="left:'+n._x+'px;top:'+n._y+'px;min-height:'+nodeH(n)+'px">'+
    '<span class="nb-top">'+engBadge(n.engine,false)+
      '<span class="nb-id" title="'+esc(n.id)+'">'+esc(n.id)+'</span>'+
      '<span class="nb-seq">#'+n.seq+'</span>'+
      (n.mode==='write' ? '<span class="chip w" title="write 模式 · 有独立工作副本">W</span>' : '')+
    '</span>'+
    '<span class="nb-bot">'+statusChip(n)+
      (n.reused ? '<span class="chip reuse" title="没真跑，直接用了上次的结果">↺ 复用</span>' : '')+
      '<span class="nb-t">'+esc(t)+'</span>'+
    '</span>'+
    (n.status==='running' && n.phase==='streaming'
      ? '<span class="nb-tail">'+esc((n.live&&n.live.tail||'').slice(-40))+'</span>' : '')+
    (n.status==='running' && n.phase==='preparing_worktree'
      ? '<span class="nb-tail">正在准备独立工作副本 · 还没联系 AI</span>' : '')+
  '</button>';
}
const cur = (start, now) => (start==null ? null : now - start);

function layout(sc){
  const byq = {}; sc.nodes.forEach(n => byq[n.seq] = n);
  const depth = {}; sc.nodes.forEach(n => depth[n.seq] = 0);
  for (let pass=0; pass<sc.nodes.length; pass++){
    let moved = false;
    for (const e of sc.edges){
      if (!byq[e.a] || !byq[e.b]) continue;
      if (depth[e.b] < depth[e.a] + 1){ depth[e.b] = depth[e.a] + 1; moved = true; }
    }
    if (!moved) break;
  }
  const waiting = sc.nodes.filter(n => n.status==='queued' || n.status==='discovered');
  const collapse = waiting.length >= 6;
  const shown = collapse ? sc.nodes.filter(n => !(n.status==='queued'||n.status==='discovered')) : sc.nodes.slice();

  const cols = {};
  shown.forEach(n => { (cols[depth[n.seq]] = cols[depth[n.seq]] || []).push(n); });
  const keys = Object.keys(cols).map(Number).sort((a,b)=>a-b);
  let maxY = 0;
  keys.forEach((d,ci) => {
    let y = PAD;
    cols[d].forEach(n => { n._x = PAD + ci*(COLW+GAPX); n._y = y; y += nodeH(n) + GAPY; });
    maxY = Math.max(maxY, y);
  });
  const W = PAD*2 + (keys.length ? (keys.length-1)*(COLW+GAPX) + COLW : COLW);
  return {shown, waiting, collapse, W:Math.max(W, 420), H:maxY, depth, byq};
}

/* 回放骨架:只占位、不假装有数据。aria-hidden —— 播报交给顶栏的 role="status" */
function skeletonGraph(){
  const col = (n, tall) => '<div class="sk-col">'+Array.from({length:n},(_,i)=>
    '<div class="sk sk-card'+(tall && i===0 ? ' tall' : '')+'"></div>').join('')+'</div>';
  return '<div class="sk-wrap" aria-hidden="true"><div class="sk-cols">'+col(2,false)+col(3,true)+col(1,false)+'</div></div>';
}

let QOPEN = false;
/* 一条边的 SVG。**声明 = 实线、推断 = 虚线**,这不是装饰:
   UIREQ 原话是「把推断当事实展示是这个页面最容易造成的误导」。
   ⚠️ 单独抽出来是为了它**能被测**:回归里会拿一份把虚线去掉的变体跑一遍,
   断言那几条守它的断言真的会变红 —— 不然守着这件事本身是假绿。 */
function edgeSvg(e, i, x1, y1, x2, y2){
  const dx = Math.max(34, (x2-x1)/2);
  const d = 'M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2;
  const inf = e.kind==='inferred';
  // 先铺一条透明粗线当热区(见 .ehit 的样式注释:细虚线实测命中率只有 8%)。
  // 它排在可见线**之前**,所以不挡任何观感;`tabindex` 让键盘也够得到。
  return '<path class="ehit" d="'+d+'" data-edge="'+i+'" tabindex="0" role="button"'+
    ' aria-label="'+(inf?'推断的依赖，回车看依据':'声明的依赖，回车看依据')+'"></path>'+
    '<path d="'+d+'" data-edge="'+i+'" stroke="'+(inf?'var(--faint)':'var(--ink-soft)')+'"'+
    ' stroke-width="'+(inf?1.4:1.8)+'"'+(inf?' stroke-dasharray="5 5"':'')+
    ' marker-end="url(#'+(inf?'mi':'md')+')" opacity="'+(inf?.8:.72)+'"></path>'+
    (e.warn ? '<circle cx="'+((x1+x2)/2)+'" cy="'+((y1+y2)/2)+'" r="7" fill="var(--c-timeout)" data-edge="'+i+'"></circle>'+
              '<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2+3.6)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--on-solid)" data-edge="'+i+'" style="pointer-events:none">!</text>' : '');
}

function renderGraph(sc, sel){
  const L = layout(sc);
  const cv = $('#gcanvas');
  if (sc.run.state === 'replaying'){ cv.innerHTML = skeletonGraph(); return; }
  if (!sc.nodes.length){
    cv.style.width = ''; cv.style.height = '';
    cv.innerHTML = '<div class="empty"><div class="e-ic">'+ICO.wait+'</div>'+
      '<h2>等待运行开始</h2>'+
      '<p>已经连上观测服务，还没有收到任何环节。脚本一开跑，这里就会出现第一张卡片。</p>'+
      '<p style="font-size:12.5px;color:var(--faint)">观测台地址以启动器输出的 localhost 地址为准；端口被占用时会自动换一个。<br>关掉最后一个页面后，服务将在 60 秒后退出。</p>'+
      '<p class="dots">等待事件<span>·</span><span>·</span><span>·</span></p></div>';
    return;
  }
  let qh = 0;
  if (L.collapse) qh = QOPEN ? 320 : 62;
  cv.style.width = L.W + 'px';
  cv.style.height = (L.H + qh + PAD) + 'px';

  const edges = sc.edges.filter(e => L.shown.some(n=>n.seq===e.a) && L.shown.some(n=>n.seq===e.b));
  const paths = edges.map((e,i) => {
    const a = L.shown.find(n=>n.seq===e.a), b = L.shown.find(n=>n.seq===e.b);
    return edgeSvg(e, i, a._x + COLW, a._y + nodeH(a)/2, b._x, b._y + nodeH(b)/2);
  }).join('');

  const defs = '<defs>'+
    '<marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'+
      '<path d="M0 1 L9 5 L0 9 z" fill="var(--ink-soft)"/></marker>'+
    '<marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'+
      '<path d="M0 1.5 L8.4 5 L0 8.5" fill="none" stroke="var(--faint)" stroke-width="1.6"/></marker>'+
  '</defs>';

  let qband = '';
  if (L.collapse){
    const q = L.waiting;
    qband = '<div class="qband" style="left:'+PAD+'px;top:'+(L.H+4)+'px;width:'+(L.W-PAD*2)+'px">'+
      '<div class="qband-h">'+ICO.wait.replace('<svg','<svg style="width:15px;height:15px;color:var(--faint)"')+
        '<span>另有 <b>'+q.length+'</b> 个排队中 —— 已进入本地队列，<b>一个字都还没发给 AI</b>。同时能跑的上限是 '+sc.run.slots+' 个。</span>'+
        '<button type="button" class="qband-toggle" id="qtoggle">'+(QOPEN?'收起':'展开全部')+'</button></div>'+
      (QOPEN ? '<div class="qgrid scroll">'+q.map(n =>
        '<button type="button" class="qitem" data-seq="'+n.seq+'" aria-pressed="'+(sel===n.seq?'true':'false')+'">'+
          engBadge(n.engine,true)+'<span class="qi-id" title="'+esc(n.id)+'">'+esc(n.id)+'</span>'+
          '<span class="qi-t">'+(n.status==='discovered'?'准备中':'排队 '+fmtDur(cur(n.t.q[0], sc.run.now)))+'</span>'+
        '</button>').join('')+'</div>' : '')+
    '</div>';
  }

  cv.innerHTML = '<svg class="gedges" width="'+L.W+'" height="'+(L.H+qh+PAD)+'">'+defs+paths+'</svg>'+
    L.shown.map(n => nodeHTML(n, sel===n.seq)).join('') + qband;
  cv._edges = edges;
}

/* ============================================================
   6. B 主视图 · 时间轴
   排队等待与真正在跑必须是两段;纯时间先后绝不画成箭头
   ============================================================ */
/* 时间刻度缩放:1× = 整程铺满容器(不可再缩小,那是「适应」本身);
   放大后横向可滚,用于把长运行里几十秒的环节看清楚 */
let TLZ = 1;
function applyTlZoom(){
  const w = $('#tlwrap'), has = SC.nodes.length > 0 && SC.run.state !== 'replaying';
  w.style.setProperty('--tlz', TLZ);
  w.setAttribute('data-scrollx', (has && TLZ > 1) ? '1' : '0');
  $('#zoomBox').style.visibility = has ? 'visible' : 'hidden';
  $('#zoomVal').textContent = (Number.isInteger(TLZ) ? TLZ : TLZ.toFixed(1)) + '×';
  $('#zoomOut').disabled = TLZ <= 1;
  $('#zoomIn').disabled = TLZ >= 8;
  $('#zoomIn').setAttribute('aria-label','放大时间刻度');
  $('#zoomOut').setAttribute('aria-label','缩小时间刻度');
  $('#zoomFit').setAttribute('aria-label','时间刻度复位到整程铺满');
}

function renderTimeline(sc, sel){
  const w = $('#tlwrap'), key = $('#tlKey');
  key.hidden = !(sc.nodes.length && sc.run.state !== 'replaying');
  if (sc.run.state === 'replaying'){
    w.innerHTML = '<div class="sk-tl" aria-hidden="true">'+Array.from({length:7},(_,i)=>
      '<div class="sk-tlrow"><div class="sk" style="width:clamp(150px,20vw,236px);flex:0 0 auto"></div>'+
      '<div style="flex:1 1 auto;display:flex;padding-right:14px"><div class="sk" style="margin-left:'+((i*11)%34)+'%;width:'+(26+((i*13)%40))+'%"></div></div></div>').join('')+'</div>';
    return;
  }
  if (!sc.nodes.length){ w.innerHTML = '<div class="empty"><div class="e-ic">'+ICO.wait+'</div><h2>等待运行开始</h2><p>还没有收到任何环节。</p></div>'; return; }
  const T = Math.max(1, sc.run.now);
  const pc = v => Math.max(0, Math.min(100, v / T * 100));
  /* 放大后刻度要跟着变密,否则 4 倍宽的轨道上还是只有 5 个刻度 */
  const nTick = Math.min(25, Math.round(4 * TLZ) + 1);
  const ticks = Array.from({length:nTick}, (_,i) => {
    const f = i/(nTick-1);
    return '<span class="tl-tick" style="left:'+(f*100)+'%">'+(i===0?'0s':fmtDur(T*f))+'</span>';
  }).join('');

  const rows = sc.nodes.map(n => {
    const segs = [];
    const q0 = n.t.q[0], q1 = n.t.q[1], r0 = n.t.r[0], r1 = n.t.r[1];
    if (q0 != null){
      const end = (q1==null ? sc.run.now : q1);
      segs.push('<span class="tl-seg q" style="left:'+pc(q0)+'%;width:'+Math.max(.6,pc(end)-pc(q0))+'%" title="排队等待 '+fmtDur(end-q0)+' —— 还没派给 AI，也还没开始消耗超时预算"></span>');
    }
    if (r0 != null){
      const end = (r1==null ? sc.run.now : r1);
      const open = r1==null;
      segs.push('<span class="tl-seg run'+(open?' open':'')+(n.reused?' dim':'')+'" style="left:'+pc(r0)+'%;width:'+Math.max(.6,pc(end)-pc(r0))+'%;--sc:'+engColor(n.engine)+'" title="'+
        (n.reused?'复用校验（原执行耗时 '+fmtDur(n.origRun)+' 不在本次时间轴上）':'执行 '+fmtDur(end-r0))+'"></span>');
    }
    if (q0 == null && r0 == null) segs.push('<span class="tl-note" style="left:0">已发现 · 还没进队列</span>');
    else if (n.status==='unlogged') segs.push('<span class="tl-note" style="left:'+pc(r0==null?q0:r0)+'%;padding-left:'+0+'px;transform:translateX(6px)">…记录从此处起不完整，没有结束时间</span>');
    return '<button type="button" class="tl-row" data-seq="'+n.seq+'" aria-pressed="'+(sel===n.seq?'true':'false')+'">'+
      '<span class="tl-lab">'+engBadge(n.engine,true)+
        '<span class="tl-id" title="'+esc(n.id)+'">'+esc(n.id)+'</span>'+
        '<span class="nb-seq">#'+n.seq+'</span>'+
        (n.mode==='write'?'<span class="chip w">W</span>':'')+
        (n.reused?'<span class="chip reuse">↺</span>':'')+
      '</span><span class="tl-track">'+segs.join('')+'</span></button>';
  }).join('');

  w.innerHTML = '<div class="tl-inner">'+
    '<div class="tl-axis"><span class="tl-lab" style="padding-left:14px;font:10px/1 var(--mono);color:var(--faint);letter-spacing:.08em">环节（按进入顺序）</span><span class="tl-ticks">'+ticks+'</span></div>'+
    rows +
    '</div>';

  key.innerHTML =
    '<i><span class="sw" style="background:repeating-linear-gradient(90deg,color-mix(in oklab,var(--faint) 24%,var(--surface)) 0 5px,color-mix(in oklab,var(--faint) 12%,var(--surface)) 5px 10px);border:1px solid var(--line-2)"></span>排队等待（还没派给 AI）</i>'+
    '<i><span class="sw" style="background:var(--accent);opacity:.9"></span>真正在跑（颜色 = 引擎）</i>'+
    '<span>先后顺序不代表因果 —— 名额只有 '+sc.run.slots+' 个，排在后面很可能只是在等名额。</span>'+
    '<span style="margin-left:auto">'+(TLZ > 1 ? '按住拖动 或 Shift+滚轮 可左右平移　·　' : '')+
      '全长 '+fmtDur(T)+'　·　'+sc.nodes.length+' 个环节</span>';
}

/* ============================================================
   7. C 详情面板
   ============================================================ */
let ATT = {seq:null, turn:null, idx:0, raw:false};

function factsHTML(n){
  const f = [];
  f.push(['型号', esc(n.model)]);
  f.push(['强度', esc(n.effort)]);
  const qd = (n.t.q[0]==null) ? '—' : fmtDur((n.t.q[1]==null ? SC.run.now : n.t.q[1]) - n.t.q[0]);
  f.push(['排队时长', qd + (n.t.q[1]==null && n.t.q[0]!=null ? ' <span class="u">仍在排队</span>' : '')]);
  if (n.reused){
    /* ⚠️ 「来自哪一次运行」事件流里没有这个事实,缺了就别拼半句话。 */
    f.push(['原执行耗时', fmtDur(n.origRun) +
      (n.reuseFrom ? ' <span class="u">来自 '+esc(n.reuseFrom)+'</span>'
                   : ' <span class="u">来自上一次同指纹的运行</span>')]);
    f.push(['本次复用校验', fmtDur(n.t.r[1]-n.t.r[0])]);
  } else if (n.status==='running'){
    f.push(['已执行', fmtDur(SC.run.now - n.t.r[0])]);
  } else if (n.status==='unlogged'){
    f.push(['执行耗时', '<span class="unknownv">没有结束记录</span>']);
  } else {
    f.push(['执行耗时', (n.t.r[0]!=null && n.t.r[1]!=null) ? fmtDur(n.t.r[1]-n.t.r[0]) : '<span class="unknownv">—</span>']);
  }
  const w = n.status==='running' ? (n.live?n.live.words:0) : n.words;
  f.push(['产出字数', w==null ? '<span class="unknownv">—</span>' : fmtN(w)+' <span class="u">字</span>']);
  /* ⚠️ 这是**绝对 token 数**,不是百分比 —— 上下文腐化跟绝对长度走,不跟"占窗口多少"走。
        各后端窗口普遍 1M,换算成比例会把腐化低估掉。所以这里不显示窗口、不显示百分比。
        ⚠️ null **不等于 0**:cursor / kimi 恒为 null,把它当 0 会让它们永远看起来最新鲜。 */
  f.push(['上下文占用', n.ctx==null
    ? '<span class="unknownv">未知</span> <span class="u">'+(n.engine==='cursor'||n.engine==='kimi'?'该引擎不提供':'本次没拿到')+'</span>'
    : fmtN(n.ctx)+' <span class="u">token'+(n.ctx>=400000 ? ' · 已过重开线' : n.ctx>=300000 ? ' · 已过关注线' : '')+'</span>']);
  const modeTxt = n.mode==='write'
    ? '<b>write 模式 · 独立工作副本</b><div class="u" style="margin-top:3px;line-height:1.5">明确授权改文件，且改动有隔离。</div>'
    : '<b>read 模式 · 无独立工作副本</b><div class="u" style="margin-top:3px;line-height:1.5">不打算改文件；<b>改了也没有隔离，会落在主目录</b>。Codex 为系统级只读，其余引擎为约定只读。</div>';
  return '<div class="facts">'+
    f.map(x => '<div class="fact"><span class="k">'+x[0]+'</span><span class="v">'+x[1]+'</span></div>').join('')+
    '<div class="fact wide"><span class="k">模式</span><span class="v">'+modeTxt+'</span></div>'+
  '</div>';
}

function box(v, ic, title, body){
  return '<div class="alertbox" data-v="'+v+'"><div class="ab-t">'+ic+esc(title)+'</div>'+body+'</div>';
}
const diagList = d => !d||!d.length ? '' :
  '<div style="margin-top:8px"><div class="bd-lab" style="padding:0 0 4px">诊断信息</div>'+
  d.map(x=>'<div style="font:11px/1.7 var(--mono);color:var(--faint);overflow-wrap:anywhere">'+esc(x)+'</div>').join('')+'</div>';

function statusBlock(n){
  const o = [];
  if (n.status==='running'){
    if (n.phase==='preparing_worktree'){
      o.push(box('quiet', ICO.info, '运行中 · 正在准备独立工作副本',
        '<p style="margin:0">已经拿到执行名额，正在复制代码、建分支。<b>这一段还没有联系 AI</b>，所以现在一个字都没有是正常的。</p>'+
        '<div style="margin-top:7px;font:11px/1.6 var(--mono);color:var(--faint)">最近一条事件：'+esc(n.live.event)+'</div>'));
    } else {
      o.push('<div class="livewrap"><div class="livehead"><span class="dt"></span>正在输出</div>'+
        '<div class="livetail">'+esc(n.live.tail)+'<span class="cursor"></span></div>'+
        '<div class="livemeta"><span>已产出 '+fmtN(n.live.words)+' 字</span><span>'+esc(n.live.event)+'</span></div></div>');
    }
  }
  if (n.status==='queued'){
    o.push(box('quiet', ICO.wait, '排队中 · 尚未派给 AI',
      '<p style="margin:0">已经进入本地队列，但<b>一个字都还没发出去</b> —— 对面什么都不知道。同时能跑的上限是 '+SC.run.slots+' 个。</p>'+
      '<p style="margin:7px 0 0">已排队 <b>'+fmtDur(cur(n.t.q[0], SC.run.now))+'</b>。'+
      '<span style="color:var(--faint)">超时预算从拿到名额那一刻才开始算，所以这里没有倒计时，也不该有。</span></p>'));
  }
  if (n.status==='discovered'){
    o.push(box('quiet', ICO.wait, '已发现 · 正在做本地准备',
      '<p style="margin:0">系统认下了这个环节，还没有进入队列。</p>'));
  }
  if (n.status==='rejected'){
    /* ⚠️ 没见过的 phase **原样显示 + 通用文案**，不许崩、不许并到某一档上。 */
    const r = REJECT[n.rejected.kind] || {
      t:'被本地挡下了（原因码：'+n.rejected.kind+'）',
      d:'这个原因码不在本页已知的六档里 —— 可能是工具比页面新。',
      todo:['拿这个原因码去查工具那边的 docs/EVENTS-graph.md。','下面那段是当时抛出来的原文。'],
    };
    o.push(box('reject', ICO.ban, '被拒绝 · '+r.t,
      '<p style="margin:0">'+esc(r.d)+'</p>'+
      '<p style="margin:7px 0 0;color:var(--faint)"><b>没有花钱，也没有一个"结局不明"的任务在后台跑。</b></p>'+
      '<ul class="todo">'+r.todo.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+
      (n.rejected.detail ? '<div style="margin-top:8px;font:11px/1.7 var(--mono);color:var(--faint)">'+esc(n.rejected.detail)+'</div>' : '')+
      (n.rejected.plannedPath ? '<div style="margin-top:8px"><div class="bd-lab" style="padding:0 0 4px">预定位置（去核对有没有残留）</div>'+
        '<code class="path">'+esc(n.rejected.plannedPath)+'</code>'+copyBtn('复制路径', n.rejected.plannedPath)+'</div>' : '')));
  }
  if (n.status==='unknown'){
    o.push(box('hazard', ICO.warn, '这个环节干没干完，说不清',
      '<p style="margin:0">'+esc(n.error.desc)+'</p>'+
      '<ul class="todo"><li><b>停下来人工看一眼。</b></li>'+
      '<li><b>绝不能自动重跑</b> —— 盲目重跑可能让同一件事做两遍。</li></ul>'+
      diagList(n.error.diagnostics)));
  }
  if (n.status==='abandoned'){
    const a = n.abandonedAt, W = {
      discovered:['中断时停在「已发现」','本地准备中，还没派出去。<b>大概率什么都没发生</b>，没有需要你去管的东西。'],
      queued:['中断时停在「排队中」','在等名额，<b>一个字都还没发给 AI</b>。没有需要你去管的东西。'],
      run_read:['中断时正在跑（read）','执行结果不明。'],
      pre:['中断时正在跑（write · 还没开始建工作副本）','当时还在做准备检查，<b>创建动作压根还没开始，不会有工作副本</b>。<b>不用去找。</b>'],
      creating:['中断时正在跑（write · 正在建、未确认建成）','<b>可能已经开始建工作副本，位置未确认。</b>下面这个是预定位置 —— <b>未确认，可能不存在</b>，去看看有没有。'],
      created:['中断时正在跑（write · 工作副本已确认建成）','<b>执行与代码去向都不明；工作副本已建成。</b>'],
    };
    const key = a.stage==='running' ? (a.writePhase || 'run_read') : a.stage;
    const w = W[key] || W.run_read;
    const soft = (a.stage==='discovered' || a.stage==='queued');
    o.push(box(soft ? 'quiet' : 'lost', soft ? ICO.info : ICO.cut, '没有看到这个环节的结局 · '+w[0],
      '<p style="margin:0">'+w[1]+'</p>'+
      (soft ? '' : '<p style="margin:7px 0 0;color:var(--faint)">这不是"结果永远拿不到了" —— 缺的只是一份权威的结束回执。</p>')+
      (key==='created' ? '<ul class="todo"><li><b>禁止自动重跑</b> —— 可能把还没保住的代码覆盖掉。</li></ul>' : '')));
  }
  if (n.status==='unlogged'){
    o.push(box('unlog', ICO.warn, '记录从第 '+fmtN(n.unloggedFrom)+' 条起不完整，这个环节的状态未知',
      '<p style="margin:0">既不能说它跑完了，也不能说它没跑完 —— <b>我们只是没看到</b>。'+
      '它<b>很可能好好地跑完了</b>，只是从那一条起没人记下来。</p>'+
      '<p style="margin:7px 0 0;color:var(--faint)">这个环节<b>不会</b>因此被标成「未见结局」—— 把一次记录故障摊派成一堆环节事故，会让你去排查根本没出问题的环节。</p>'));
  }
  if (n.status==='callback_error'){
    /* ⚠️ 唯一一个「既有回执、又向调用方抛了异常」的结局。
          文案必须把人指向**编排那段 JS**,不是后端 —— AI 那边每一轮都跑完了。 */
    o.push(box('hazard', ICO.warn, '各轮都跑完了，是编排那段 JS 自己抛了异常',
      '<p style="margin:0">这个环节<b>有终态、有回执、有产出</b> —— 下面的每一轮都照常可读。'+
      '炸掉的是<b>你写的那段编排代码</b>（<code>conversation()</code> 的回调），不是 AI，也不是引擎。</p>'+
      '<ul class="todo"><li>去看回调里那段 JS，异常原文在下面。</li>'+
      '<li><b>别去后端那边查</b> —— 那一侧没有故障。</li></ul>'+
      (n.error ? (n.error.bounded ? bounded(n.error.bounded, '异常原文（有界摘要）')
        : '<div style="margin-top:8px;font:11px/1.7 var(--mono);color:var(--faint);overflow-wrap:anywhere">'+esc(n.error.desc)+'</div>') : '')+
      diagList(n.error && n.error.diagnostics)));
  }
  if (n.error && (n.status==='contract_error' || n.status==='timeout' || n.status==='backend_failed')){
    const v = n.status==='backend_failed' ? 'alert' : 'quiet';
    o.push(box(v, ICO.warn, n.error.title,
      '<p style="margin:0 0 8px">'+esc(n.error.desc)+'</p>'+
      /* 原因取自某一轮时要标出处 —— 多轮节点里「哪一轮出的事」是另一个问题。 */
      (n.error.descFrom ? '<div style="margin:-4px 0 8px;font-size:11.5px;color:var(--faint)">这句话来自 <code>'+esc(n.error.descFrom)+'</code> 那一轮（回执归档正常，节点级不再重复一份）。</div>' : '')+
      (n.error.bounded ? bounded(n.error.bounded, '错误详情（有界摘要）') : '')+
      diagList(n.error.diagnostics)));
  }
  return o.length ? '<div class="sec">'+o.join('')+'</div>' : '';
}

const WT = {
  cleaned:          ['已清理', '收尾时确认删除成功。'],
  unconfirmed:      ['收尾时未确认清理', '这是收尾那一刻的快照，不是现在的事实 —— 那个目录现在可能已经被别的东西清掉了，可去核对。'],
  /* ⚠️ **事件流不会产出这一档** —— `removed:false` 按合同读作 `unconfirmed`（见 §5.8）。
        留着它只为静态演示里那个"系统明确选择保留现场"的场景（交付状态不明时的刻意保留），
        那是**另一件事**：那条路上系统确实知道自己没删。 */
  kept:             ['已为你保留', '交付状态不明，系统刻意没删这份副本（里面可能有还没进分支的代码）。路径在此，去核对。'],
  not_started:      ['不会有', '创建动作还没开始，不用去找。'],
  unconfirmed_create:['未确认建成', '可能已经开始建，位置未确认 —— 可能不存在。'],
  failed:           ['建不起来', '创建失败；常见原因是上次残留清不掉，那东西可能还在。'],
  pending:          ['正在建', '这个环节还在跑。'],
  unlogged:         ['状态未记录', '记录从某处起不完整，这一栏的状态未知。'],
};

/**
 * 分支 / 基线两行。
 *
 * ⚠️ 这两个值来自 `workspaceSummary`，而它**只在回执没归档成功时才出现**（§5.8 的第二级兜底）。
 * 回执正常在的时候，这里一个字段都没有 —— 那**不是丢了**，是"去回执里读"。
 * 早先无条件印这两行，回执正常的那条主路径上就会看到两个空的 `<code>`。
 */
function wsFields(w){
  const o = [];
  if (w.branch) o.push('<div class="kv"><span class="k">分支</span><span class="v"><code style="font-family:var(--mono);font-size:12.5px">'+esc(w.branch)+'</code> '+copyBtn('复制', w.branch)+'</span></div>');
  if (w.base)   o.push('<div class="kv"><span class="k">基线</span><span class="v"><code style="font-family:var(--mono);font-size:12.5px">'+esc(w.base)+'</code></span></div>');
  if (!o.length) o.push('<div style="margin:6px 0 0;font-size:12px;line-height:1.65;color:var(--faint)">'+
    '分支名、基线、工作副本路径这些都记在<b>回执</b>里（这一层只在回执没归档成功时才顺带带上它们）。</div>');
  return o.join('');
}

/**
 * 改动清单那一栏。
 *
 * ⚠️ **事件流里没有清单**：一次改动能有几万个文件，把它放进事件就是给页面开一个无上限的口子，
 * 所以 §5.8 刻意不带。这里的正确做法是**说清楚它在哪**，而不是渲染一个空列表 ——
 * 空列表长得和"确知零项"一模一样，而两者的意思正相反。
 */
function changeList(w){
  /* ⚠️ `changesKnown` 回答的是「**这棵树的改动状况探到了没有**」，
        **不是**「有没有改动」。true 只说明收尾那一步的 git 探测跑成了，
        改了一万个文件的节点同样是 true —— 所以这里一个字都不许提"有/没有改动"。 */
  const known = w.changesKnown;
  const line = known === true  ? '收尾时<b>探到了</b>这棵树的改动状况（清单本身不进事件流，见下）。'
             : known === false ? '收尾时<b>没能确认</b>有没有改动（探测那一步没跑成）—— 有没有改动都说不准。'
             : '这一层不带改动清单。';
  return '<div style="margin:9px 0 0;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;'+
         'font-size:12px;line-height:1.7;color:var(--ink-soft)">'+
         '<b>改动清单</b> —— '+line+
         '<div style="color:var(--faint);margin-top:3px">要逐个文件看，去<b>回执</b>或下面的完整 diff。</div></div>';
}

function writeBlock(n){
  if (n.mode !== 'write') return '';
  const w = n.write || {}, o = [];
  o.push('<h3 class="sec-h">改动区块<span class="hint">write 环节专有</span></h3>');

  if (w.outcome === 'delivered'){
    /* ⚠️ 判据只有 `netEmpty`（= delivered 且 **diff 自己是零字节**）。
          早先还接受「清单长度为 0」，而事件流里**根本没有清单**（改动清单无上限，
          §5.8 刻意不带），于是"拿不到清单"被显示成"零项 —— 这次提交没有净改动"，
          一句**结论**被凭空造了出来。
       ⚠️ 后来又错过一次，方向相反但同样严重：拿 `changesKnown === true` 当"确知没有改动"。
          那个键只表示「git 探测**跑成了**」，改了一大堆文件的节点同样是 true —— 于是
          页面对着一次正常交付说"没有净改动"。**`xKnown` 是认识论的，不是事实的。** */
    const zero = w.netEmpty === true;
    o.push(box('ok', ICO.info, zero ? '已交付，但这次提交没有净改动' : '已交付',
      zero ? '<p style="margin:0">分支往前走了，但净改动是空的。'+
             '<b>这不是「无改动」</b>：分支上确实有这次提交。</p>'
           : '<p style="margin:0">改动已提交，进了下面这个分支。</p>'+
             (n.status!=='ok' ? '<p style="margin:7px 0 0"><b>这次执行不合格，但改动是可用的</b> —— 分支照常给出。</p>' : '')));
    o.push(wsFields(w));
    o.push(changeList(w));
    o.push('<div style="margin-top:9px">'+assetRow('改动详情', w.diff, '打开完整 diff（超长时按有界摘要折叠）')+'</div>');
  }
  else if (w.outcome === 'no-changes'){
    o.push(box('quiet', ICO.info, '无改动',
      '<p style="margin:0"><b>收尾检查未发现可交付的改动。</b></p>'+
      '<p style="margin:7px 0 0;color:var(--faint)">这里只陈述系统看到的事实：收尾快照里没有检测到可交付的改动。'+
      '系统并不知道这个 AI 的意图 —— 也可能它改错了地方，或者改的是被忽略的文件。</p>'));
    o.push(wsFields(w));
    o.push('<div style="margin-top:4px;font-size:12.5px;color:var(--faint)">没有改动清单可看，因此这里不给入口。</div>');
  }
  else if (w.outcome === 'unknown'){
    o.push(box('hazard', ICO.warn, '交付状态不明 —— 现场已为你保留',
      '<p style="margin:0"><b>改动有没有落到分支上，说不清。</b></p>'+
      '<p style="margin:7px 0 0">'+esc(w.reason || '收尾流程没有走完。')+'</p>'+
      '<ul class="todo"><li><b>不要自动重跑。</b>重跑可能让同一件事做两遍，或把那份还没保住的代码覆盖掉。</li>'+
      '<li>'+(w.worktree && w.worktree.path ? '先打开下面这个目录核对里面有什么。' : '工作副本的路径要去回执里读，先核对那个目录里有什么。')+'</li></ul>'+
      /* ⚠️ 路径来自 workspaceSummary，而它**只在回执没归档成功时才出现**。回执正常时这里
            没有路径 —— 印一个空的 <code> 出来，等于叫人去核对一个空字符串。 */
      (w.worktree && w.worktree.path
        ? '<div style="margin-top:9px"><div class="bd-lab" style="padding:0 0 4px">工作副本路径（系统当时选择了保留）</div>'+
          '<code class="path">'+esc(w.worktree.path)+'</code>'+copyBtn('复制路径', w.worktree.path)+'</div>' : '')));
    o.push(wsFields(w));
    o.push('<div style="margin-top:9px">'+assetRow('改动详情', w.diff)+'</div>');
  }
  else if (w.outcome === 'unlogged'){
    o.push(box('unlog', ICO.warn, '交付结论：状态未记录',
      '<p style="margin:0">记录从第 '+fmtN(n.unloggedFrom)+' 条起不完整，这个环节的交付结论我们没有看到。<b>不代表它没交付。</b></p>'));
  }
  else {
    o.push(box('quiet', ICO.info, '还没有交付结论',
      '<p style="margin:0">'+(n.status==='rejected'
        ? '这个环节还没开跑就被本地挡下了，不存在交付结论。'
        : '这个环节还没跑到收尾那一步。')+'</p>'));
  }

  const ws = (w.worktree && WT[w.worktree.state]) || WT.unlogged;
  o.push('<div style="margin-top:11px;border-top:1px dashed var(--line);padding-top:9px">'+
    '<div class="kv"><span class="k">工作副本</span><span class="v"><b>'+esc(ws[0])+'</b>'+
      '<div style="color:var(--faint);font-size:11.5px;line-height:1.55;margin-top:3px">'+esc(ws[1])+'</div>'+
      (w.worktree && w.worktree.why ? '<div style="color:var(--faint);font-size:11.5px;line-height:1.55;margin-top:3px">'+esc(w.worktree.why)+'</div>' : '')+
      /* ⚠️ 判据是「上面那段有没有已经把路径印出来」，**不是**工作副本处于哪一档。
            早先这里写的是 `state!=='kept'` —— 于是 `delivered` + 收尾没删成 的组合下，
            文案说着「路径在此，去核对」，却一个路径都不给。会去核对的人扑一次空，
            这一栏后面说什么都不算数了。 */
      (w.worktree && w.worktree.path && w.outcome !== 'unknown'
        ? '<div style="margin-top:6px"><code class="path">'+esc(w.worktree.path)+'</code>'+copyBtn('复制路径', w.worktree.path)+'</div>' : '')+
    '</span></div></div>');
  return '<div class="sec">'+o.join('')+'</div>';
}

function attemptBody(n, a){
  const o = [];
  const inTxt = a.input && a.input.s==='have' ? a.input.text : null;
  /* ⚠️ 「还在读」不是「不可读」:后者是结论,前者只是还没到。混成一句会把一次正常的
        按需读取显示成一次故障。 */
  const inWait = !inTxt && a.input && a.input.s==='have';
  o.push('<details class="fold"><summary>'+ICO.caret+'输入原文'+
    '<span class="sm">'+(inTxt ? fmtN(inTxt.length)+' 字' : inWait ? '读取中…' : '不可读')+'</span></summary>'+
    '<div class="fold-body">'+
      (inTxt ? '<pre class="raw scroll">'+esc(inTxt)+'</pre><div style="margin-top:7px">'+copyBtn('复制输入原文', inTxt)+'</div>'
             : inWait ? '<div class="a-why">正在从归档里读回来…</div>'
             : assetRow('输入原文', a.input))+
      (a.input && a.input.s==='unavailable' && a.input.code==='fingerprint-only'
        ? '<div style="margin-top:6px;font-size:12.5px;color:var(--faint);line-height:1.6">'+
          '原运行未归档输入原文，仅保留指纹。<b>这里不会"还原"一份看起来对的输入</b> —— 没有逐字节验证过的还原就是伪造历史。</div>' : '')+
    '</div></details>');

  const outTxt = a.output && a.output.s==='have' ? a.output.text : null;
  if (outTxt){
    const raw = ATT.raw;
    o.push('<div class="fold" style="background:var(--surface)"><div style="padding:9px 11px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650">产出'+
      '<span class="sm" style="font:10.5px/1 var(--mono);color:var(--faint);font-weight:400">'+fmtN(outTxt.length)+' 字</span>'+
      '<span class="viewswitch"><button type="button" data-raw="0" aria-pressed="'+(!raw)+'">渲染</button>'+
      '<button type="button" data-raw="1" aria-pressed="'+raw+'">看原文</button></span></div>'+
      '<div class="fold-body" id="outBody">'+ (raw ? '<pre class="raw scroll">'+esc(outTxt)+'</pre>' : '<div class="md">'+md(outTxt)+'</div>')+
      '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'+copyBtn('复制产出原文', outTxt)+
      '<button type="button" class="totop" id="toTop">回到顶部</button></div>'+
      '<div style="clear:both"></div></div></div>');
  } else if (a.output && a.output.s==='have'){
    o.push('<div class="fold" style="background:var(--surface)"><div class="fold-body" style="border-top:0;padding-top:11px">'+
      '<div class="a-why">正在从归档里读回来…</div></div></div>');
  } else {
    o.push('<div class="fold" style="background:var(--surface)"><div class="fold-body" style="border-top:0;padding-top:11px">'+assetRow('产出', a.output)+'</div></div>');
  }

  /* ⚠️ 可降级字段 ≤2 KiB 时是**原样字符串**（没有摘要块），超限才有摘要块。
        只画摘要块的话，绝大多数（短的）打回原因**一个字都不显示** —— 而"为什么被打回"
        正是这一栏存在的全部理由。 */
  if (a.reject) o.push('<div style="margin-top:2px">'+bounded(a.reject, '被打回的原因（有界摘要）')+'</div>');
  else if (a.rejectText) o.push('<div style="margin-top:2px"><div class="bd-lab" style="padding:0 0 4px">被打回的原因</div>'+
    '<pre class="raw scroll">'+esc(a.rejectText)+'</pre></div>');
  else if (a.rejectAsset) o.push('<div style="margin-top:2px">'+assetRow('打回原因', a.rejectAsset)+'</div>');
  return o.join('');
}

/* 一轮的结局。**五档 + not-started** —— 后者的结论一点都不含糊：**它没开始**。 */
const TV = {ok:'完成', contract_error:'格式不合格', backend_failed:'引擎报错', timeout:'超时',
            unknown:'说不清', 'not-started':'没能开始', running:'进行中', queued:'排队中'};
/* 一次尝试的结局。四档 + 几个派生态。 */
const AV = {accepted:'通过', rejected:'被打回', 'no-output':'空产出', failed:'失败',
            running:'进行中', queued:'排队中', discovered:'准备中',
            timeout:'超时', unknown:'说不清', abandoned:'未见结局',
            rejected_local:'本地挡下', unlogged:'状态未记录'};

/* 取当前选中的轮。**单轮节点也走这里** —— 数据层没有「没有轮的旧路径」，
   只有渲染层在 turns.length===1 时不显示外层控件。 */
function curTurn(n){
  const ts = n.turns || [];
  if (!ts.length) return null;
  if (ATT.seq !== n.seq){ ATT = {seq:n.seq, turn:ts.length-1, idx:0, raw:false}; }
  const ti = Math.min(ATT.turn ?? ts.length-1, ts.length-1);
  return {t:ts[ti], ti};
}

/* 「环节 → 轮 → 尝试」。两层分段控件用**同一条规则**：段数由数组生成、没有上限，
   只有一段时不显示该层控件。 */
function attemptsBlock(n){
  const ts = n.turns || [];
  if (!ts.length) return '';
  const {t, ti} = curTurn(n);
  const as = t.attempts || [];
  const idx = Math.min(ATT.idx, Math.max(0, as.length-1));

  /* ── 外层：轮。⚠️ 一段对话在第 N 轮被中断时，**前面每一轮都是权威的结局** ——
        它们照常列出、产出照常点得开，只有最后那一轮标成结局不明。
        把整个节点一律涂成「结果不明」是这里最容易犯的错。 */
  const turnBar = ts.length > 1
    ? '<div class="segbar" style="margin-bottom:6px">'+ts.map((x,i)=>
        '<button type="button" class="seg" data-turn="'+i+'" data-r="'+
        (x.status==='ok'?'accepted':(x.status&&x.status!=='running'&&x.status!=='queued')?'rejected':'')+
        '" aria-pressed="'+(i===ti)+'">'+
        '<span class="sdot"></span>第 '+(i+1)+' 轮 · '+esc(x.key)+' · '+(TV[x.status]||x.status)+'</button>').join('')+
      '<span style="font:10.5px/1.5 var(--mono);color:var(--faint);flex:1 1 100%">'+
      '轮与轮之间的等待<b>不属于任何一轮</b>，也不烧任何一轮的预算 —— 那是编排那段 JS 自己在跑别的东西。</span></div>'
    : '';

  /* 会话毒化点。⚠️ 这一句**只对对话节点显示**（buildScene 已经过了那道闸）：
         的意思是「工具从这一轮之后把整段封口了，之后任何一轮
        都会被拒」—— 它常常正是「为什么只聊了这么几轮」的唯一解释。不说出来，
        用户看到的就是一段莫名其妙戛然而止的对话。 */
  /* 会话毒化点。⚠️ 这一句**只对对话节点显示**（`buildScene` 已经过了那道闸：
        `node:observed.prompt.state === "not-applicable"` ⟺ 这是一段对话）。
        `sessionReusable === false` 的意思是「工具从这一轮之后把整段**封口**了，
        之后任何一轮都会被拒，而且拒在任何副作用之前 —— 所以它们不留下任何痕迹」。
        ⚠️ 它常常正是「**为什么只聊了这么几轮**」的唯一解释。不说出来，用户看到的
        就是一段莫名其妙戛然而止的对话，而页面上每一轮都显示正常。 */
  const poison = n.poisonedAt
    ? box('warn', ICO.warn, '这段对话在 <code>'+esc(n.poisonedAt)+'</code> 之后被封口',
        '<p style="margin:0">那一轮之后，这个会话<b>不能再接着聊</b> —— 工具当场把整段封了口，'+
        '后面任何一轮都会被拒（拒在任何副作用之前，所以你不会看到它们留下任何痕迹）。</p>'+
        '<p style="margin:7px 0 0;color:var(--faint)">这通常就是「为什么只有这几轮」的答案。</p>')
    : '';

  /* 没能开始的那一轮：它有开头也有结尾，只是结论是「没开始」，不是「结果不明」。 */
  if (t.status === 'not-started'){
    return '<div class="sec"><h3 class="sec-h">输入与产出<span class="hint">'+ts.length+' 轮</span></h3>'+
      turnBar + box('warn', ICO.warn, '这一轮没能开始',
        '<p style="margin:0">它在<b>入场</b>那几关就被挡下了，一条消息都没发出去。'+
        '<b>它的结论一点都不含糊：它没开始</b> —— 不是「结果不明」。</p>'+
        (t.error ? '<div style="margin-top:8px;font:11px/1.7 var(--mono);color:var(--faint)">'+esc(t.error)+'</div>' : ''))+
      '</div>';
  }

  if (!as.length){
    /* open_session 就失败的那一轮：attempts 为空，**一条 attempt 事件都不发**。
       ⚠️ 它不是 not-started —— 那是业务结局，这一轮**进了** turns[]。 */
    return '<div class="sec"><h3 class="sec-h">输入与产出<span class="hint">'+ts.length+' 轮</span></h3>'+
      turnBar + box('quiet', ICO.info, '这一轮没有发出任何一次尝试',
        '<p style="margin:0">会话在发第一条消息之前就没能建立起来，所以没有可看的输入与产出。</p>')+
      '</div>';
  }

  /* ── 内层：尝试。 */
  const bar = as.length > 1
    ? '<div class="segbar">'+as.map((a,i)=>'<button type="button" class="seg" data-att="'+i+'" data-r="'+
        (a.verdict==='rejected'?'rejected':a.verdict==='accepted'?'accepted':'')+'" aria-pressed="'+(i===idx)+'">'+
        '<span class="sdot"></span>第 '+a.n+' 次 · '+(AV[a.verdict]||a.verdict)+'</button>').join('')+
      '<span style="font:10.5px/1.5 var(--mono);color:var(--faint);flex:1 1 100%">两次的输入是不同的：第 2 次由「上次被打回的原因 + 纠正要求 + 原任务原文」拼出。</span></div>'
    : '';
  const hint = ts.length > 1
    ? ts.length+' 轮 · 本轮 '+as.length+' 次尝试'
    : (as.length>1 ? as.length+' 次尝试' : '单次尝试');
  return '<div class="sec"><h3 class="sec-h">输入与产出<span class="hint">'+hint+'</span></h3>'+
    turnBar + poison + bar + attemptBody(n, as[idx]) + '</div>';
}

/* 现场文件挂在**轮**上,不挂在节点上 —— 一段对话可能有好几份现场(每一轮各一份)。
   把它画在节点级,等于把第 3 轮的现场说成整个节点的现场。 */
function sceneBlock(t){
  if (!t) return '';
  const s = t.scene || {};
  const none = t.sceneNone;
  return '<div class="sec"><h3 class="sec-h">现场文件<span class="hint">目录，三样各自独立</span></h3>'+
    (none ? box('lost', ICO.cut, '本次未捕获现场',
      '<p style="margin:0">系统只有在<b>有序收场</b>时才会把会话日志等现场文件抢救出来；这次没有机会跑那一步，所以<b>一样都没留下</b>。'+
      '这里不给一个点了 404 的入口。</p>') : '')+
    assetRow('会话日志', s.session, '打开会话日志')+
    assetRow('回答原文', s.answer, '打开回答原文')+
    assetRow('状态快照', s.snapshot, '打开状态快照')+
  '</div>';
}

/**
 * 这个环节留下来的、可以打开的东西。
 *
 * ⚠️ **产出（artifact）就是跑这个环节的全部目的** —— 早先这一份连同回执、任务单、
 * 提问原文、角色文件一起，一个都没进 view-model：页面把一个环节的执行过程讲得很细，
 * 却给不出"东西在哪"。
 * ⚠️ 顺序是刻意的：**产出在最上面**。其余四份是给"要复核这次执行"的人用的。
 */
function filesBlock(n){
  const f = n.files; if (!f) return '';
  const rows = [
    ['产出文件', f.artifact, '打开产出'],
    ['回执',     f.receipt,  '打开回执'],
    ['任务单',   f.spec,     '打开任务单'],
    ['提问原文', f.prompt,   '打开提问原文'],
    ['角色文件', f.role,     '打开角色文件'],
  ];
  /* 五样全是"本来就不该有 / 没记录"时整块不画 —— 一屏五行"不适用"没有信息量。 */
  if (!rows.some(([, a]) => a && (a.s === 'have' || a.s === 'unavailable' || a.s === 'gone'))) return '';
  return '<div class="sec"><h3 class="sec-h">这个环节留下的文件<span class="hint">点开即是归档里那一份</span></h3>'+
    rows.map(([name, a, label]) => assetRow(name, a, label)).join('')+'</div>';
}

function renderDetail(sc, sel){
  const el = $('#detail'), ws = $('#workspace');
  const n = sc.nodes.find(x => x.seq === sel);
  if (!n){ el.hidden = true; ws.setAttribute('data-detail','closed'); return; }
  el.hidden = false; ws.setAttribute('data-detail','open');
  resolveNodeAssets(n);      // 按需取正文:只取当前打开的这一个环节
  COPYBUF.length = 0;
  const st = STATUS[n.status] || {};
  el.innerHTML =
    '<div class="d-head"><div class="d-title">'+engBadge(n.engine,false)+
      '<h2 class="d-id" title="'+esc(n.id)+'">'+esc(n.id)+'</h2>'+
      '<span class="nb-seq">#'+n.seq+'</span>'+
      '<button type="button" class="d-close" id="dClose" title="关闭详情" aria-label="关闭详情面板"><span aria-hidden="true">✕</span></button></div>'+
      '<div class="d-sub">'+statusChip(n)+
        (n.reused ? '<span class="chip reuse">↺ 复用 · 没真跑，直接用了上次的结果</span>' : '')+
        '<span class="chip">'+esc(st.long||'')+'</span>'+
      '</div>'+
      (n.note ? '<div style="margin-top:7px;font:11px/1.6 var(--mono);color:var(--faint)">'+esc(n.note)+'</div>' : '')+
    '</div>'+
    '<div class="d-scroll scroll" id="dScroll">'+
      factsHTML(n)+
      (n.reused ? '<div class="sec">'+box('quiet', ICO.info, '这是一次复用，不是一次验证',
        '<p style="margin:0">这个环节<b>没真跑</b>，直接用了 <code>'+esc(n.reuseFrom)+'</code> 的结果。'+
        '上面的「原执行耗时」是<b>当初那次</b>跑出来的；这次只做了一次 '+fmtDur(n.t.r[1]-n.t.r[0])+' 的复用校验。</p>')+'</div>' : '')+
      statusBlock(n)+
      filesBlock(n)+
      writeBlock(n)+
      attemptsBlock(n)+
      sceneBlock((curTurn(n)||{}).t)+
    '</div>';
}

/* ============================================================
   8. 状态与装配
   ============================================================ */
(function(){ const s = SCENES.find(x=>x.key==='offline'); s.run.replayIncomplete = true; s.run.replayFrom = 1907; })();

let SC = SCENES[0], SEL = SC.select, VIEW = 'graph', ZOOM = 1;

function hasDeps(sc){ return sc.edges && sc.edges.length > 0; }

function renderLegend(sc){
  if (VIEW !== 'graph' || !sc.nodes.length){ $('#legend').innerHTML = ''; return; }
  if (!hasDeps(sc)){ $('#legend').innerHTML = '<span style="color:var(--faint)">没有任何依赖信息</span>'; return; }
  const inf = sc.edges.some(e => e.kind==='inferred');
  $('#legend').innerHTML =
    '<i title="用户自己写的一句声明"><span class="lg-line"></span>声明（未经验证）</i>'+
    (inf ? '<i title="系统从输入原文里猜出来的"><span class="lg-dash"></span>推断（可点开看依据）</i>' : '')+
    '<span style="color:var(--faint)">纯时间先后不画箭头</span>';
}

function applyZoom(){
  const cv = $('#gcanvas'), wrap = $('#gwrap');
  let sp = document.getElementById('gspacer');
  if (!SC.nodes.length){
    cv.style.cssText = 'padding:22px'; if (sp) sp.remove();
    $('#zoomBox').style.visibility = 'hidden'; return;
  }
  $('#zoomBox').style.visibility = VIEW==='graph' ? 'visible' : 'hidden';
  /* 缩放条是两个视图共用的,切回图视图要把时间轴那边设的禁用/命名还原 */
  $('#zoomIn').disabled = false; $('#zoomOut').disabled = false;
  $('#zoomIn').setAttribute('aria-label','放大图视图');
  $('#zoomOut').setAttribute('aria-label','缩小图视图');
  $('#zoomFit').setAttribute('aria-label','缩放至适应画布');
  const GW = parseFloat(cv.style.width) || 400, GH = parseFloat(cv.style.height) || 300;
  cv.style.transformOrigin = '0 0';
  cv.style.transform = 'scale('+ZOOM+')';
  cv.style.position = 'absolute'; cv.style.top = '0'; cv.style.left = '0'; cv.style.padding = '0';
  if (!sp){ sp = document.createElement('div'); sp.id = 'gspacer';
    sp.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none'; wrap.appendChild(sp); }
  sp.style.width = (GW*ZOOM)+'px'; sp.style.height = (GH*ZOOM)+'px';
  wrap.setAttribute('data-scrollx', (GW*ZOOM > wrap.clientWidth + 2) ? '1' : '0');
  $('#zoomVal').textContent = Math.round(ZOOM*100)+'%';
}
function fitZoom(){
  const cv = $('#gcanvas'), wrap = $('#gwrap');
  const GW = parseFloat(cv.style.width) || 1, GH = parseFloat(cv.style.height) || 1;
  const z = Math.min(1, (wrap.clientWidth - 26)/GW, (wrap.clientHeight - 26)/GH);
  ZOOM = Math.max(.3, Math.round(z*20)/20); applyZoom();
}

function render(){
  if (!hasDeps(SC) && SC.nodes.length) VIEW = 'timeline';
  $('#tabGraph').setAttribute('aria-pressed', VIEW==='graph');
  $('#tabTimeline').setAttribute('aria-pressed', VIEW==='timeline');
  $('#tabGraph').disabled = (!hasDeps(SC) && SC.nodes.length > 0);
  $('#tabGraph').title = $('#tabGraph').disabled ? '这次运行没有任何依赖信息，图视图会退化成一堆孤立方块' : '';
  $('#gwrap').hidden = VIEW !== 'graph';
  $('#tlwrap').hidden = VIEW !== 'timeline';

  renderTop(SC); renderBanners(SC); renderLegend(SC);
  if (VIEW === 'graph'){ renderGraph(SC, SEL); applyZoom(); $('#tlKey').hidden = true; }
  else { renderTimeline(SC, SEL); applyTlZoom(); }
  /* 详情面板是整段 innerHTML 重建的,重建就把读者的滚动条弹回顶部。
     以前只有来事件时才弹一下,现在「已跑」要每秒走字,不保住位置就变成**持续**往上弹,
     长报告根本没法读。看的还是同一个环节的同一次尝试时,滚动位置就该留着。 */
  const dKey = JSON.stringify([SEL, ATT.turn, ATT.idx, ATT.raw]);
  const keepY = dKey === LAST_DETAIL_KEY ? ($('#dScroll') || {}).scrollTop : null;
  renderDetail(SC, SEL);
  LAST_DETAIL_KEY = dKey;
  if (keepY) { const s = $('#dScroll'); if (s) s.scrollTop = keepY; }
}
let LAST_DETAIL_KEY = null;

function setScene(key){
  const sc = SCENES.find(s => s.key === key); if (!sc) return;
  SC = sc; SEL = sc.select; VIEW = 'graph'; ZOOM = 1; TLZ = sc.tlz || 1; QOPEN = false;
  ATT = {seq:null, turn:null, idx:0, raw:false};
  const pop = document.getElementById('edgePop'); if (pop) pop.remove();
  document.querySelectorAll('.scene-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.scene===key));
  $('#conn').setAttribute('data-s', sc.conn.s); $('#connText').textContent = sc.conn.text;
  render();
  if (sc.key === 'scale') requestAnimationFrame(fitZoom);
}

$('#scenes').innerHTML = SCENES.map(s =>
  '<button type="button" class="scene-btn" data-scene="'+s.key+'" aria-pressed="'+(s.key===SC.key)+'">'+esc(s.label)+'</button>').join('');

/* ---- 主题 ---- */
function setTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  try { t ? localStorage.setItem('gvz-theme', t) : localStorage.removeItem('gvz-theme'); } catch(e){}
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeLabel').textContent = dark ? '浅色' : '深色';
}
try { const saved = localStorage.getItem('gvz-theme'); if (saved) setTheme(saved); else setTheme(null); } catch(e){ setTheme(null); }

/* ---- 边解释气泡 ---- */
function showEdgePop(i, ev){
  const e = ($('#gcanvas')._edges || [])[i]; if (!e) return;
  const wrap = $('#gwrap'), r = wrap.getBoundingClientRect();
  let pop = document.getElementById('edgePop');
  if (!pop){ pop = document.createElement('div'); pop.id = 'edgePop'; pop.className = 'edgepop'; wrap.appendChild(pop); }
  const body = e.kind === 'inferred'
    ? '<b>推断的依赖 · 可能猜错，也可能漏掉</b>'+e.why+'<div style="margin-top:6px;color:var(--faint)">系统发现后一个环节的输入里提到了前一个环节的产出文件，据此猜了一条边。</div>'
    : '<b>显式声明（未经验证）</b>用户自己写了这条依赖。<div style="margin-top:6px;color:var(--faint)"><b>仅展示，不影响执行顺序</b> —— 系统既不校验也不据此调度。</div>';
  const warn = e.warn ? '<div style="margin-top:8px;padding:7px 9px;border-radius:6px;background:color-mix(in oklab,var(--c-timeout) 13%,var(--surface));border:1px solid color-mix(in oklab,var(--c-timeout) 42%,var(--line));color:var(--ink)"><b>一致性提示</b> · '+e.warn+'</div>' : '';
  pop.innerHTML = '<button type="button" class="x" id="popX" aria-label="关闭说明"><span aria-hidden="true">✕</span></button>'+body+warn;
  const x = Math.min(Math.max(8, ev.clientX - r.left + wrap.scrollLeft + 12), wrap.scrollLeft + wrap.clientWidth - 320);
  const y = Math.max(8, ev.clientY - r.top + wrap.scrollTop + 10);
  pop.style.left = x+'px'; pop.style.top = y+'px';
}

/* ---- 拖拽平移:鼠标用户没有触控板的双指手势,给一个抓手。
       阈值 5px —— 小于它仍然算一次点击,不会把「选中环节」这件事弄丢。 ---- */
let SUPPRESS_CLICK = false;
function enablePan(el){
  let sx = 0, sy = 0, sl = 0, st = 0, down = false, panned = false;
  const move = e => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!panned && Math.abs(dx) + Math.abs(dy) < 5) return;
    panned = true; el.classList.add('panning');
    el.scrollLeft = sl - dx; el.scrollTop = st - dy;
  };
  const up = () => {
    if (!down) return;
    down = false; el.classList.remove('panning');
    if (panned) SUPPRESS_CLICK = true;
    panned = false;
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
  };
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    SUPPRESS_CLICK = false;
    down = true; panned = false;
    sx = e.clientX; sy = e.clientY; sl = el.scrollLeft; st = el.scrollTop;
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  });
  el.addEventListener('wheel', e => {
    if (e.shiftKey && e.deltaY && !e.deltaX){ el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive:false});
}
enablePan($('#gwrap')); enablePan($('#tlwrap'));

/* ---- 事件(全部委托,只读:不改变任何运行状态) ---- */
document.addEventListener('click', ev => {
  if (SUPPRESS_CLICK){ SUPPRESS_CLICK = false; return; }   /* 刚拖过,这一下不是点击 */
  const t = ev.target;
  const hit = s => t.closest ? t.closest(s) : null;

  const sb = hit('.scene-btn'); if (sb){ setScene(sb.dataset.scene); return; }
  if (hit('#themeBtn')){
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark'); return;
  }
  if (hit('#tabGraph') && !$('#tabGraph').disabled){ VIEW='graph'; render(); return; }
  if (hit('#tabTimeline')){ VIEW='timeline'; render(); return; }
  const tlStep = d => { const s = TLZ < 2 ? .5 : 1; TLZ = Math.min(8, Math.max(1, +(TLZ + d*s).toFixed(1)));
                        renderTimeline(SC, SEL); applyTlZoom(); };
  if (hit('#zoomIn')){ if (VIEW === 'graph'){ ZOOM = Math.min(1.8, ZOOM+.1); applyZoom(); } else tlStep(+1); return; }
  if (hit('#zoomOut')){ if (VIEW === 'graph'){ ZOOM = Math.max(.3, ZOOM-.1); applyZoom(); } else tlStep(-1); return; }
  if (hit('#zoomFit')){ if (VIEW === 'graph') fitZoom(); else { TLZ = 1; renderTimeline(SC, SEL); applyTlZoom(); } return; }
  if (hit('#qtoggle')){ QOPEN = !QOPEN; renderGraph(SC, SEL); applyZoom(); return; }
  if (hit('#popX')){ const p = document.getElementById('edgePop'); if (p) p.remove(); return; }

  const edge = t.getAttribute && t.getAttribute('data-edge');
  if (edge != null){ showEdgePop(+edge, ev); return; }

  const cp = hit('.copy'); if (cp){ copyText(COPYBUF[+cp.dataset.copy] || '', cp); return; }
  if (hit('#dClose')){ SEL = null; render(); return; }

  const seg = hit('.seg');
  if (seg && seg.dataset.turn != null){
    /* 换轮 = 换了一段对话:内层的尝试下标必须归零,不能把上一轮的第 3 次带过来。 */
    ATT.turn = +seg.dataset.turn; ATT.idx = 0; ATT.raw = false; renderDetail(SC, SEL); return;
  }
  if (seg){ ATT.idx = +seg.dataset.att; ATT.raw = false; renderDetail(SC, SEL); return; }
  const rw = t.closest && t.closest('[data-raw]');
  if (rw){ ATT.raw = rw.dataset.raw === '1'; renderDetail(SC, SEL); return; }
  if (hit('#toTop')){ const s = $('#dScroll'); if (s) s.scrollTo({top:0, behavior:'smooth'}); return; }

  const nb = hit('.nodebox') || hit('.qitem') || hit('.tl-row');
  if (nb){ SEL = +nb.dataset.seq; ATT = {seq:null, turn:null, idx:0, raw:false};
    const p = document.getElementById('edgePop'); if (p) p.remove();
    if (VIEW === 'graph'){ renderGraph(SC, SEL); applyZoom(); } else { renderTimeline(SC, SEL); applyTlZoom(); }
    renderDetail(SC, SEL); return; }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){
    const p = document.getElementById('edgePop');
    if (p) p.remove(); else if (SEL != null){ SEL = null; render(); }
    return;
  }
  /* 边的依据也得能用键盘看。热区是 <path>,它没有原生的"回车 = 点击",得自己接。
     弹窗按鼠标坐标定位,键盘触发时没有坐标 —— 拿热区自己的外框中心顶上。 */
  if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar'){
    const a = document.activeElement;
    if (a && a.classList && a.classList.contains('ehit')){
      ev.preventDefault();
      const b = a.getBoundingClientRect();
      showEdgePop(+a.getAttribute('data-edge'), {clientX: b.left + b.width/2, clientY: b.top + b.height/2});
    }
  }
});
addEventListener('resize', () => { if (VIEW==='graph' && SC.key==='scale') fitZoom(); });


/* ============================================================
   9. 实况接线：SSE → 归约器 → 渲染

   §2.5 那一半是纯的（喂事件、出 view-model），这一半负责三件脏活：
   连上去、把 `ref` 换成正文、把两者接到已有的渲染器上。

   ⚠️ **页面只读**：不提供暂停、重跑、改参数、合分支（docs/EVENTS-graph.md §10.9 第 4 条）。
   ============================================================ */

/** 有没有一个服务端在后面。静态打开这份 HTML 时它是 false —— 那时页面就是演示台。 */
const LIVE = location.protocol === 'http:' || location.protocol === 'https:';

let R = null;               // 归约器累加器
let LIVE_SCENE = null;      // 最近一次 buildScene 的产物
let ES = null;              // EventSource
let SEEN = null;            // 已消费过的 seq —— 重连回放与 live 交界处按它去重

/* ---- 正文按需取：`ref` → 文本 --------------------------------
   事件里只有 `ref`，正文在 `/file`。**不预取** —— 一次运行可能有上百个环节，
   预取等于把整份归档拉进浏览器。详情面板一次只看一个环节，用到哪个取哪个。

   ⚠️ 取不回来（404）**不等于「本来就没有」**：记录时它确实在。所以这种情况
   落到 `gone` 这一档，而不是 `unavailable` —— 两者的处置完全不同。 */
const FILECACHE = new Map();   // ref → {state:'loading'|'ok'|'gone'|'error', text?, why?}

function fileURL(ref){ return '/file?ref=' + encodeURIComponent(ref); }

function wantFile(ref){
  if (!LIVE || !ref) return null;
  const hit = FILECACHE.get(ref);
  if (hit) return hit;
  const rec = {state:'loading'};
  FILECACHE.set(ref, rec);
  fetch(fileURL(ref))
    .then(r => {
      if (r.status === 404){ rec.state = 'gone'; return null; }
      if (!r.ok) { rec.state = 'error'; rec.why = 'HTTP ' + r.status; return null; }
      /* 归档区**理论上**不可变，但它就在磁盘上，谁都能改。服务端把它读到的那一份的指纹
         放在这个响应头里，页面拿它和事件里记的对一次 —— 这是"页面上这份 = 事件记录的那份"
         唯一的对证手段（docs/EVENTS-graph.md §11）。⚠️ 不比 Content-Length：合同明说那两个数**允许**对不上。 */
      rec.gotSha = r.headers.get('X-Graph-Sha256') || null;
      return r.text();
    })
    .then(t => { if (t != null){ rec.state = 'ok'; rec.text = t; } })
    .catch(e => { rec.state = 'error'; rec.why = String(e && e.message || e); })
    .finally(() => { if (SC === LIVE_SCENE) renderDetail(SC, SEL); });
  return rec;
}

/**
 * 把一个 `{s:'have', ref}` 资产解析成渲染器认的形状。
 *
 * - 正文还在路上 → 保持 `have` 但没有 `text`，`attemptBody` 会显示「读取中」；
 * - 404 → `gone`（记录时在、现在取不回来）；
 * - 其它错误 → `unavailable`，**原样带上 HTTP 状态**，不归到任何已知原因上。
 */
function resolveAsset(a){
  if (!a || a.s !== 'have' || !a.ref) return a;
  const rec = wantFile(a.ref);
  if (!rec) return a;
  if (rec.state === 'ok'){
    /* ⚠️ 对不上**不算取失败**：文件确实在、也确实读到了。所以照常把正文给出去，
          只是加一条"这不是事件记录的那一份"。藏起来会更糟 —— 人会拿一份被改过的
          字节当证据；判成错误也更糟 —— 人会以为文件丢了。 */
    const o = {s:'have', text:rec.text, ref:a.ref, byteCount:a.byteCount, sha256:a.sha256};
    if (a.sha256 && rec.gotSha) o.verify = rec.gotSha === a.sha256 ? 'ok' : 'mismatch';
    else if (a.sha256) o.verify = 'no-header';
    if (o.verify === 'mismatch'){ o.gotSha = rec.gotSha; }
    return o;
  }
  if (rec.state === 'gone') return {s:'gone'};
  if (rec.state === 'error') return {s:'unavailable', code:'viewer-fetch-failed', why:'这个页面没能把它取回来：'+rec.why};
  return {s:'have', ref:a.ref, byteCount:a.byteCount, loading:true};
}

/** 详情面板渲染前，把**当前这一个环节**用到的正文解析出来。其余环节一个字都不取。 */
function resolveNodeAssets(n){
  if (!LIVE || !n || !n.turns) return;
  for (const t of n.turns){
    for (const a of (t.attempts||[])){
      a.input = resolveAsset(a.input); a.output = resolveAsset(a.output);
    }
  }
}

/* ---- 连接 ---------------------------------------------------- */

function pushLive(){
  const prevKey = SC && SC.key;
  LIVE_SCENE = buildScene(R);
  const i = SCENES.findIndex(x => x.key === 'live');
  if (i >= 0) SCENES[i] = LIVE_SCENE; else SCENES.unshift(LIVE_SCENE);
  if (prevKey === 'live' || prevKey == null){
    SC = LIVE_SCENE;
    $('#conn').setAttribute('data-s', SC.conn.s); $('#connText').textContent = SC.conn.text;
    /* ⚠️ 选中的环节按 **seq** 记，不按下标 —— 新环节随时会插进来。 */
    if (SEL != null && !SC.nodes.some(x => x.seq === SEL)) SEL = null;
    render();
  }
}

/* 「已跑」得自己走字。
   ⚠️ 页面原先只在**来事件**时重绘,而桥按 5 分钟切片 wait —— 安静期一条事件都没有,
      于是时钟冻住、进行中的横条也不再变长,页面却还亮着绿灯「实时」。
      这一秒一次的心跳只在**真的连着一个活着的 run** 时跳;静态归档、断线、回放中都不跳
      (那些情况下没有「现在」可言,自己走字就是编数字)。 */
setInterval(() => {
  if (R.run.final || R.ctl.overflow) return;
  if (R.replay.mode !== 'live') return;
  if (runStateOf(R) !== 'running') return;
  pushLive();
}, 1000);

/* 渲染节流：一次回放可能是几万条事件，每条都渲一次会把主线程钉死。
   ⚠️ 节流的是**渲染**，不是消费 —— 事件一条不少地进归约器。 */
let rafPending = false;
function scheduleRender(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; pushLive(); });
}

function connectLive(){
  R = R || newLiveState();
  SEEN = SEEN || new Set();
  R.replay.mode = 'connecting';
  ES = new EventSource('/events');

  ES.addEventListener('hello', e => {
    try { const h = JSON.parse(e.data); if (h.graphId) R.graphId = h.graphId; } catch(err){ R.badLines++; }
    R.replay.mode = 'replaying';
    scheduleRender();
  });

  ES.addEventListener('tx', e => {
    let ev = null;
    try { ev = JSON.parse(e.data); } catch(err){ R.badLines++; scheduleRender(); return; }
    /* ⚠️ 重连后服务端会**完整回放**，交界处必然重叠 —— 按 seq 去重。
          少了这一步，一次重连会把每个环节的尝试数翻倍。 */
    if (ev && typeof ev.seq === 'number'){
      if (SEEN.has(ev.seq)) return;
      SEEN.add(ev.seq);
    }
    R.replay.done++;
    applyEvent(R, ev);
    scheduleRender();
  });

  ES.addEventListener('control', e => {
    try { applyControl(R, JSON.parse(e.data)); } catch(err){ R.badLines++; }
    scheduleRender();
  });

  /* 积压超限被服务端主动断开。**这不是故障** —— 重连后从记录文件完整回放，不会丢事件。 */
  ES.addEventListener('viz:overflow', e => {
    try { R.ctl.overflow = JSON.parse(e.data); } catch(err){ R.ctl.overflow = {}; }
    scheduleRender();
  });

  ES.onopen = () => {
    R.ctl.overflow = null;
    if (R.replay.mode === 'connecting') R.replay.mode = 'replaying';
    scheduleRender();
  };
  ES.onerror = () => {
    /* EventSource 自己会重连；这里只负责如实把「现在看到的不是当前状态」说出来。 */
    if (ES.readyState === EventSource.CLOSED || ES.readyState === EventSource.CONNECTING){
      R.replay.mode = 'lost';
      scheduleRender();
    }
  };

  /* 回放什么时候算完？服务端没有「回放结束」这一帧，而回放与 live 走的是同一条 `tx`。
     所以判据只能是**这一侧**的：一段时间没有新事件，就把骨架撤掉。
     ⚠️ 这只影响那条「正在回放」的横幅，不影响任何一条数据。 */
  let quiet = null;
  const bump = () => {
    clearTimeout(quiet);
    quiet = setTimeout(() => {
      if (R.replay.mode === 'replaying'){ R.replay.mode = 'live'; pushLive(); }
    }, 400);
  };
  ES.addEventListener('tx', bump);
  ES.addEventListener('hello', bump);
}

/* ---- 启动 ---------------------------------------------------- */

if (LIVE){
  /* 有服务端 = 这是产品界面，不是演示台：把原型开关整条拿掉。 */
  const pb = document.querySelector('.protobar'); if (pb) pb.remove();
  SC = {key:'live', label:'实时',
        run:{id:null, dir:null, state:'waiting', slots:1, now:0, elapsed:null},
        conn:{s:'wait', text:'正在连接'}, select:null, edges:[], nodes:[]};
  SEL = null;
  render();
  connectLive();
} else {
  setScene(SC.key);
}
</script>
</body>
</html>
